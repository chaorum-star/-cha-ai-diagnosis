<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="app-version" content="6.0.0"><title>차팀장 AI 직원 진단</title><style>

:root{
  --bg:#F6F2EC; --paper:#FFFDF9; --ink:#191816; --muted:#726E68;
  --line:#E6DED4; --orange:#F47345; --orange-soft:#FFF0E8;
  --purple:#6B55E8; --purple-soft:#F0EDFF; --green:#2B7A55;
  --shadow:0 18px 55px rgba(35,28,22,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
a{color:inherit}
.app{min-height:100vh}
.top{
  position:sticky; top:0; z-index:20; background:rgba(246,242,236,.92);
  backdrop-filter:blur(14px); border-bottom:1px solid rgba(0,0,0,.035)
}
.topin{max-width:760px;margin:auto;padding:14px 18px}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:10px;background:#191816;color:#fff;display:grid;place-items:center;font-weight:900}
.brand{font-size:14px;font-weight:900}
.progress{height:7px;background:#E6DED4;border-radius:99px;overflow:hidden;margin-top:12px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#FFAA7F);transition:.25s}
.wrap{max-width:760px;margin:auto;padding:24px 16px 56px}
.card{background:var(--paper);border:1px solid rgba(0,0,0,.045);border-radius:26px;padding:28px 22px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.04em;color:var(--orange);margin-bottom:12px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(36px,9.5vw,58px);line-height:1.06;letter-spacing:-.06em;margin-bottom:18px}
h2{font-size:clamp(29px,7.5vw,42px);line-height:1.15;letter-spacing:-.05em;margin-bottom:14px}
h3{font-size:20px;letter-spacing:-.035em}
.lead{font-size:17px;line-height:1.68;color:#4E4A45}
.sub{font-size:14px;line-height:1.6;color:var(--muted)}
.field{margin:22px 0}
.field input,.field textarea{
  width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;
  padding:17px 16px;outline:0;font-size:16px
}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(107,85,232,.09)}
.choices{display:grid;gap:11px;margin-top:20px}
.choice{
  width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--ink);
  border-radius:17px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px
}
.choice.selected{border-color:var(--purple);background:var(--purple-soft)}
.choice b{font-size:16px}
.choice small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid #CFC6BC;display:grid;place-items:center;flex:none}
.choice.selected .dot{background:var(--purple);border-color:var(--purple);color:#fff}
.actions{display:flex;gap:10px;margin-top:28px}
.btn{border:0;border-radius:14px;padding:15px 17px;font-weight:900;min-height:50px}
.btn.main{background:#191816;color:#fff;flex:1}
.btn.orange{background:var(--orange);color:#fff;flex:1}
.btn.soft{background:#EFE9E2;color:#3F3A35}
.btn:disabled{opacity:.35}
.note{background:var(--orange-soft);border-radius:16px;padding:15px 16px;font-size:13px;line-height:1.55;color:#754936;margin-top:18px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.pill{background:#F0EAE4;border-radius:99px;padding:8px 10px;font-size:12px;font-weight:800}
.resultHero{background:linear-gradient(135deg,#191816,#2C2545);color:#fff;border-radius:24px;padding:25px;margin-bottom:15px}
.resultHero .eyebrow{color:#FFB498}
.resultHero p{color:#DAD6E2;line-height:1.6;margin:0}
.score{font-size:52px;font-weight:950;letter-spacing:-.06em}
.resultCard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:12px}
.bar{height:8px;background:#EEE8E1;border-radius:99px;overflow:hidden;margin:13px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),#9D8BFF)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini{background:#F7F3EF;border-radius:14px;padding:12px}
.mini b{display:block;font-size:12px;margin-bottom:4px}
.mini span{font-size:12px;color:var(--muted)}
.cta{background:var(--purple-soft);border:1px solid #DDD5FF;border-radius:20px;padding:20px;margin-top:18px}
.cta h3{margin-bottom:8px}
.cta p{color:#5F5879;line-height:1.55;margin:0}
.rank{display:flex;gap:12px;align-items:flex-start}
.num{width:34px;height:34px;border-radius:11px;background:#191816;color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.rankmain{flex:1}
.rankmain h3{margin:0 0 5px}
.rankmain p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.copybox{white-space:pre-wrap;background:#191816;color:#F5F1EA;border-radius:17px;padding:16px;font-size:12px;line-height:1.55;max-height:260px;overflow:auto}
.footer{font-size:11px;color:#8A857F;text-align:center;line-height:1.5;padding-top:14px}
@media(max-width:520px){
  .wrap{padding-left:12px;padding-right:12px}
  .card{padding:24px 17px;border-radius:22px}
  .grid2{grid-template-columns:1fr}
}

.hero{padding:40px 4px 20px}
.modecards{display:grid;gap:14px;margin-top:24px}
.modecard{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.modecard.dark{background:linear-gradient(135deg,#191816,#2C2545);color:#fff;border:0}
.modecard .tag{display:inline-block;border-radius:99px;padding:7px 10px;background:var(--purple-soft);color:var(--purple);font-size:11px;font-weight:900;margin-bottom:12px}
.modecard.dark .tag{background:rgba(255,255,255,.12);color:#FFB498}
.modecard h2{font-size:27px;margin-bottom:10px}
.modecard p{color:var(--muted);line-height:1.55;margin:0}
.modecard.dark p{color:#D8D4E0}
.go{font-weight:900;margin-top:18px}
.hidden{display:none!important}

.minstatus{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F7F3EF;border-radius:15px;padding:13px 14px;margin:14px 0}
.minstatus b{font-size:13px}.minstatus span{font-size:12px;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 11px;font-size:12px;font-weight:800;color:#4B4640}
.taskrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0}.taskpill{display:inline-flex;align-items:center;gap:7px;background:#F0EAE4;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800}.taskpill button{border:0;background:transparent;color:#8C847B;font-weight:900;padding:0 2px}
.explain{display:grid;gap:10px;margin-top:15px}.explainrow{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.explainrow b{display:block;font-size:13px;margin-bottom:5px}.explainrow p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.sectiontitle{margin:24px 0 10px;font-size:18px;font-weight:950;letter-spacing:-.035em}.good{color:var(--green)}.warn{color:#A86615}.bad{color:#A5483F}
.boundary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.boundary>div{border-radius:16px;padding:14px}.boundary .ai{background:var(--purple-soft)}.boundary .human{background:var(--orange-soft)}.boundary b{display:block;font-size:12px;margin-bottom:6px}.boundary p{margin:0;font-size:12px;line-height:1.5;color:#5F5879}.boundary .human p{color:#754936}
.steps{counter-reset:step;display:grid;gap:9px;margin-top:12px}.stepitem{position:relative;padding:13px 13px 13px 46px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:13px;line-height:1.5}.stepitem:before{counter-increment:step;content:counter(step);position:absolute;left:13px;top:12px;width:24px;height:24px;border-radius:8px;background:#191816;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}
@media(max-width:520px){.boundary{grid-template-columns:1fr}}

.version-badge{font-size:10px;color:#9b948d;margin-left:auto}.axisgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.axiscard{background:#f7f3ef;border-radius:16px;padding:14px}.axiscard b{display:block;font-size:12px;margin-bottom:6px}.axisnum{font-size:28px;font-weight:950;letter-spacing:-.04em}.contextcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.contextcard h3{margin-bottom:7px}.contextmeta{display:flex;flex-wrap:wrap;gap:7px}.contextmeta span{font-size:11px;background:#f3eee8;border-radius:999px;padding:7px 9px}.countgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.countbtn{border:1.5px solid var(--line);background:#fff;border-radius:15px;min-height:54px;font-weight:900}.countbtn.selected{border-color:var(--purple);background:var(--purple-soft);color:var(--purple)}.fieldlabel{display:block;font-size:13px;font-weight:900;margin-bottom:8px}.choicegroup{margin-top:18px}.choicegroup .grouptitle{font-size:13px;font-weight:900;margin-bottom:9px}.helper{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}.tasklist{display:grid;gap:8px;margin:14px 0}.taskitem{display:flex;align-items:center;gap:10px;background:#f5f0ea;border-radius:15px;padding:12px}.taskitem .grow{flex:1}.taskitem b{font-size:13px}.taskitem small{display:block;color:var(--muted);margin-top:3px}.taskitem button{border:0;background:transparent;font-weight:900;color:#8b837a}.locked{font-size:10px;background:#e9e4ff;color:var(--purple);padding:5px 7px;border-radius:999px}.quad{display:inline-block;font-size:11px;font-weight:900;padding:7px 9px;border-radius:999px;margin-bottom:8px}.quad.quick{background:#e8f6ef;color:#246b4c}.quad.foundation{background:#fff0df;color:#a46117}.quad.easy{background:#eef0ff;color:#5e59a9}.quad.later{background:#f1ede8;color:#77706a}.twobar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{background:#f7f3ef;border-radius:14px;padding:12px}.metric b{font-size:11px;display:block;margin-bottom:6px}.metric .n{font-size:22px;font-weight:950}.areawinner{border-left:4px solid var(--orange);padding-left:12px;margin:14px 0}.confidence{background:#f0edff;color:#5f5879;border-radius:16px;padding:14px;font-size:12px;line-height:1.55}.rubric{display:grid;gap:8px;margin-top:12px}.rubricrow{display:flex;justify-content:space-between;gap:12px;background:#f7f3ef;border-radius:12px;padding:10px 12px;font-size:12px}
@media(max-width:520px){.axisgrid,.twobar{grid-template-columns:1fr 1fr}.axisnum{font-size:24px}.countgrid{gap:6px}.countbtn{min-height:48px}}
</style></head><body>
<div class="app"><header class="top"><div class="topin"><div class="brandrow"><span class="logo">차</span><span class="brand" id="brandTitle">차팀장랩</span><span class="version-badge">v6</span></div><div class="progress"><i id="bar"></i></div></div></header><main class="wrap"><section class="card" id="screen"></section><div class="footer">차팀장랩 · AI는 초안과 정리를 맡고, 중요한 판단과 최종 승인은 사람이 합니다.</div></main></div>
<script>
const $=s=>document.querySelector(s);
const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,n));
const uid=(p='x')=>p+Math.random().toString(36).slice(2,8);
const FREE_KEY='cha-ai-free-v6', DEEP_KEY='cha-ai-deep-v6';
let mode='home';
let freeState={step:0,job:'',task:'',freq:0,time:0,impact:0,rules:0,data:0,approval:0};
const freshDeep=()=>({source:'direct',phase:'intro',areaCount:0,areas:[],areaIndex:0,taskAreaIndex:0,scanRefs:[],scanCursor:0,deepRefs:[],deepCursor:0});
let deepState=freshDeep();
const areaActivityChoices=[['거의 매일',5],['주 2~4일',4],['주 1회 정도',3],['월 2~3회',2],['월 1회 이하',1]];
const areaCollabChoices=[['거의 혼자',1],['1~2명과 주고받음',2],['3~5명과 협업',3],['6명 이상 / 여러 팀',4]];
const scanQs={
 freq:{t:'이 업무는 실제로 얼마나 자주 하나요?',sub:'업무영역의 빈도와 별개로, 이 반복업무 자체의 빈도를 봅니다.',a:[['거의 매일',5],['주 2~4회',4],['주 1회',3],['월 2~3회',2],['가끔',1]]},
 time:{t:'한 번 처리할 때 얼마나 걸리나요?',sub:'한 번의 소요시간이 길수록 초안·정리 위임의 체감효과가 커집니다.',a:[['10분 이하',1],['10~30분',2],['30~60분',3],['1~2시간',4],['2시간 이상',5]]},
 impact:{t:'이 업무가 늦거나 빠지면 영향이 얼마나 큰가요?',sub:'단순 귀찮음이 아니라 매출·고객·마감·누락 위험을 봅니다.',a:[['영향 거의 없음',1],['조금 불편함',2],['일정/품질에 영향',3],['고객·매출·팀에 영향',4],['놓치면 큰 손실/리스크',5]]},
 pattern:{t:'시작 조건과 결과 형태가 얼마나 반복되나요?',sub:'매번 내용은 달라도 “들어오는 것과 나가는 형태”가 비슷하면 설계하기 좋습니다.',a:[['매번 완전히 다름',1],['많이 달라짐',2],['절반 정도 반복',3],['대체로 같은 형태',4],['거의 같은 패턴',5]]},
 handoff:{t:'완료되기까지 몇 사람·채널을 거치나요?',sub:'협업이 많으면 절감효과는 커질 수 있지만 구축 복잡도도 함께 올라갑니다.',a:[['나 혼자 끝냄',1],['1명/1채널 정도',2],['2~3명 또는 여러 채널',3],['4명 이상/여러 단계',4],['여러 팀·도구를 오감',5]]}
};
const deepQs={
 rules:{t:'판단 기준을 말로 설명할 수 있나요?',sub:'AI가 따라야 할 “내 기준”을 명시할 수 있는지 봅니다.',a:[['거의 설명 못함',1],['감으로 판단하는 편',2],['일부는 설명 가능',3],['대부분 기준이 있음',4],['명확한 기준/예외가 있음',5]]},
 data:{t:'AI가 참고할 자료는 얼마나 준비돼 있나요?',sub:'메모·문서·DB·메일 등 실제 입력자료의 상태를 봅니다.',a:[['자료가 거의 없음',1],['대부분 머릿속',2],['흩어져 있음',3],['몇 곳에 정리됨',4],['한곳에 잘 정리됨',5]]},
 approval:{t:'AI 결과를 사람이 검수하는 구조가 가능한가요?',sub:'중요한 결정은 사람이 승인할 수 있어야 안전하게 위임 범위를 넓힐 수 있습니다.',a:[['검수 자체가 어려움',1],['사람 판단이 거의 전부',2],['반반 정도',3],['대부분 검수 가능',4],['초안→승인 구조가 매우 잘 맞음',5]]},
 digital:{t:'이 업무의 입력과 결과가 디지털로 접근 가능한가요?',sub:'메일·문서·시트·캘린더처럼 AI가 읽고 쓰기 쉬운 형태인지 봅니다.',a:[['대부분 오프라인/접근 어려움',1],['수기·전화가 많음',2],['일부 디지털',3],['대부분 디지털',4],['입출력이 모두 디지털',5]]}
};
const quickTasks=['고객 문의 답변','예약/일정 확인','상담 후속관리','콘텐츠 기획·작성','메일 분류·답장','자료/파일 정리','정산/리포트 정리'];
function saveFree(){try{localStorage.setItem(FREE_KEY,JSON.stringify(freeState))}catch(e){}}
function restoreFree(){try{const r=JSON.parse(localStorage.getItem(FREE_KEY)||'null');if(r)freeState={...freeState,...r}}catch(e){}}
function saveDeep(){try{localStorage.setItem(DEEP_KEY,JSON.stringify(deepState))}catch(e){}}
function restoreDeep(){try{const r=JSON.parse(localStorage.getItem(DEEP_KEY)||'null');if(r&&r.areas)deepState=r}catch(e){}}
function setScreen(html,pct=0,title='차팀장랩'){$('#screen').innerHTML=html;$('#bar').style.width=clamp(pct)+'%';$('#brandTitle').textContent=title;window.scrollTo(0,0);bind()}
function choiceHtml(items,current,target,key=''){return '<div class="choices">'+items.map(x=>`<button class="choice ${String(current)===String(x[1])?'selected':''}" data-choice data-target="${target}" data-key="${key}" data-val="${x[1]}"><div><b>${x[0]}</b></div><span class="dot">${String(current)===String(x[1])?'✓':''}</span></button>`).join('')+'</div>'}
function navHtml(label='다음',disabled=false){return `<div class="actions"><button class="btn soft" data-back>이전</button><button class="btn main" data-next ${disabled?'disabled':''}>${label}</button></div>`}
function areaById(id){return deepState.areas.find(a=>a.id===id)}
function taskByRef(ref){const a=areaById(ref.areaId);return a?.tasks.find(t=>t.id===ref.taskId)}
function allTasks(){return deepState.areas.flatMap(a=>a.tasks.map(t=>({area:a,task:t})))}
function roleFor(t){let n=t.toLowerCase();if(/상담|문의|고객|cs|답변/.test(n))return '고객관리 AI 직원';if(/콘텐츠|인스타|블로그|릴스|유튜브|게시/.test(n))return '콘텐츠 AI 직원';if(/예약|일정/.test(n))return '예약관리 AI 직원';if(/메일|이메일/.test(n))return '메일비서 AI 직원';if(/정산|매출|비용|결제|리포트/.test(n))return '운영정리 AI 직원';return '업무보조 AI 직원'}
function flowFor(t){let n=t.toLowerCase();if(/상담|문의|고객|cs|답변/.test(n))return '원문 → 분류 → 우선순위 → 답변 초안 → 사람 승인';if(/콘텐츠|인스타|블로그|릴스|유튜브|게시/.test(n))return '자료 → 주제 → 기획 → 초안 → 검수';if(/예약|일정/.test(n))return '예약정보 → 조건 확인 → 대상 분류 → 안내 초안 → 기록';if(/메일|이메일/.test(n))return '메일 → 중요도 분류 → 답장 필요 판단 → 초안 → 확인';return '입력 → 기준 적용 → 결과 초안 → 사람 확인 → 저장'}
function freeImpact(){const f=freeState;return Math.round((f.freq*.35+f.time*.30+f.impact*.35)/5*100)}
function freeFeas(){const f=freeState;return Math.round((f.rules*.40+f.data*.30+f.approval*.30)/5*100)}
function quadrant(impact,feas){if(impact>=70&&feas>=65)return ['Quick Win','quick','효과도 크고 지금 설계하기도 좋은 업무'];if(impact>=70)return ['Foundation','foundation','효과는 크지만 먼저 기준·자료·접근성을 정리할 업무'];if(feas>=65)return ['Easy Win','easy','쉽게 시작할 수 있지만 전체 우선순위는 다른 업무와 비교할 업무'];return ['Later','later','지금은 자동화보다 업무정의/정리가 먼저인 업무']}
function preImpact(area,task){const s=task.scan;return clamp(Math.round((s.freq*.25+s.time*.20+s.impact*.30+s.handoff*.15+area.activity*.10)/5*100))}
function prePriority(area,task){return preImpact(area,task)*.85+(task.scan.pattern||0)*3}
function finalScores(area,task){const s=task.scan,d=task.deep;const impact=preImpact(area,task);let feas=Math.round((s.pattern*.20+d.rules*.25+d.data*.20+d.approval*.15+d.digital*.20)/5*100);feas-=Math.max(0,(area.collab-1))*2;feas-=Math.max(0,(s.handoff-1))*2;feas=clamp(feas);const q=quadrant(impact,feas);const bonus=q[0]==='Quick Win'?6:q[0]==='Foundation'?3:q[0]==='Easy Win'?1:0;const priority=clamp(Math.round(impact*.62+feas*.38+bonus));let automation='AI 초안 + 사람 승인';if(d.approval<=2||d.digital<=2)automation='AI 보조부터';else if(d.rules>=4&&d.data>=4&&d.approval>=4&&d.digital>=4&&feas>=75)automation='반자동 워크플로우 후보';return {impact,feas,priority,q,automation}}
function prepareFromFree(){restoreFree();if(!freeState.job||!freeState.task||!freeState.freq||!freeState.time||!freeState.impact||!freeState.rules||!freeState.data||!freeState.approval)return false;const a={id:uid('a'),name:freeState.job,activity:0,collab:0,imported:true,tasks:[]};const t={id:uid('t'),name:freeState.task,imported:true,scan:{freq:freeState.freq,time:freeState.time,impact:freeState.impact,pattern:0,handoff:0},deep:{rules:freeState.rules,data:freeState.data,approval:freeState.approval,digital:0}};a.tasks.push(t);deepState={...freshDeep(),source:'free',phase:'branch',areaCount:1,areas:[a]};saveDeep();return true}
function createAreas(n,start=0){for(let i=start;i<n;i++)deepState.areas.push({id:uid('a'),name:'',activity:0,collab:0,imported:false,tasks:[]});deepState.areaCount=n}
function buildScanRefs(){deepState.scanRefs=[];allTasks().forEach(({area,task})=>{const keys=task.imported?['pattern','handoff']:['freq','time','impact','pattern','handoff'];keys.forEach(key=>deepState.scanRefs.push({areaId:area.id,taskId:task.id,key}))});deepState.scanCursor=0}
function buildDeepRefs(){const pairs=allTasks();const selected=[];deepState.areas.forEach(a=>{const cand=pairs.filter(x=>x.area.id===a.id).sort((x,y)=>prePriority(y.area,y.task)-prePriority(x.area,x.task))[0];if(cand)selected.push(cand)});const target=Math.min(6,Math.max(4,deepState.areas.length));pairs.sort((x,y)=>prePriority(y.area,y.task)-prePriority(x.area,x.task)).forEach(x=>{if(selected.length>=target)return;if(!selected.some(s=>s.task.id===x.task.id))selected.push(x)});deepState.deepRefs=[];selected.forEach(({area,task})=>{const keys=task.imported?['digital']:['rules','data','approval','digital'];keys.forEach(key=>deepState.deepRefs.push({areaId:area.id,taskId:task.id,key}))});deepState.deepCursor=0}
function deepCandidates(){const ids=new Set(deepState.deepRefs.map(r=>r.taskId));return allTasks().filter(x=>ids.has(x.task.id))}
function rankFinal(){return deepCandidates().map(x=>({...x,...finalScores(x.area,x.task)})).sort((a,b)=>b.priority-a.priority)}
function freeResultHtml(){const imp=freeImpact(),fea=freeFeas(),q=quadrant(imp,fea);return `<div class="resultHero"><div class="eyebrow">무료 진단 결과</div><span class="quad ${q[1]}">${q[0]}</span><h2>${q[2]}</h2><p><b>${esc(freeState.task)}</b>을 “효과”와 “구축 준비도”로 나눠봤습니다.</p><div class="axisgrid"><div class="axiscard"><b>효과 잠재력</b><div class="axisnum">${imp}</div></div><div class="axiscard"><b>구축 준비도</b><div class="axisnum">${fea}</div></div></div></div><div class="sectiontitle">왜 이렇게 나왔나요?</div><div class="explain"><div class="explainrow"><b>반복·시간·영향</b><p>자주 반복되고 오래 걸리며, 놓쳤을 때 영향이 클수록 먼저 위임할 가치가 커집니다.</p></div><div class="explainrow"><b>기준·자료·검수</b><p>AI가 참고할 자료와 판단기준이 있고 사람이 최종 확인할 수 있을수록 구축이 쉬워집니다.</p></div></div><div class="sectiontitle">AI에게 어디까지 맡길까요?</div><div class="resultCard"><h3>${roleFor(freeState.task)}</h3><p class="sub">${flowFor(freeState.task)}</p></div><div class="cta"><h3>이 업무가 정말 1순위인지는 아직 모릅니다.</h3><p>본업·사업·콘텐츠처럼 업무영역이 여러 개면 영역마다 빈도와 협업 구조가 다릅니다. 심층진단에서는 영역을 나누고 업무끼리 비교해 TOP3를 찾습니다.</p><div class="actions"><button class="btn orange" data-deep-from-free>내 전체 업무와 비교하기 →</button></div></div><div class="actions"><button class="btn soft" data-home>처음으로</button></div>`}
function renderFree(){const s=freeState.step;if(s===0)return setScreen(`<div class="eyebrow">무료 · 약 3분</div><h1>내가 먼저 맡겨볼<br>AI 업무는?</h1><p class="lead">업무 하나를 골라 <b>효과 잠재력</b>과 <b>구축 준비도</b>를 나눠 진단합니다.</p><div class="actions"><button class="btn orange" data-free-start>무료 진단 시작 →</button></div>`,2,'무료 AI 직원 진단');if(s===1)return setScreen(`<div class="eyebrow">1 / 8</div><h2>어떤 업무영역에서<br>일하고 계세요?</h2><div class="field"><input id="freeJob" value="${esc(freeState.job)}" placeholder="예: 크리에이터, 온라인 쇼핑몰, 회사 PM"></div>${navHtml('다음',!freeState.job)}`,12,'무료 AI 직원 진단');if(s===2)return setScreen(`<div class="eyebrow">2 / 8</div><h2>그 영역에서 가장 자주<br>반복하는 일 하나는?</h2><div class="field"><input id="freeTask" value="${esc(freeState.task)}" placeholder="예: 타사 벤치마킹 정리"></div>${navHtml('다음',!freeState.task)}`,24,'무료 AI 직원 진단');const defs=[['freq','3 / 8 · 빈도'],['time','4 / 8 · 시간'],['impact','5 / 8 · 영향'],['rules','6 / 8 · 판단기준'],['data','7 / 8 · 입력자료'],['approval','8 / 8 · 사람검수']];if(s>=3&&s<=8){const [key,label]=defs[s-3];let q;if(key==='freq')q={t:'이 일은 얼마나 자주 하나요?',sub:'반복될수록 설계 효과가 누적됩니다.',a:scanQs.freq.a};else if(key==='time')q={t:'한 번 할 때 얼마나 걸리나요?',sub:'시간이 길수록 초안·정리 위임의 체감효과가 큽니다.',a:scanQs.time.a};else if(key==='impact')q=scanQs.impact;else if(key==='rules')q=deepQs.rules;else if(key==='data')q=deepQs.data;else q=deepQs.approval;return setScreen(`<div class="eyebrow">${label}</div><h2>${q.t}</h2><p class="sub">${q.sub}</p>${choiceHtml(q.a,freeState[key],'free',key)}${navHtml(s===8?'결과 보기':'다음',!freeState[key])}`,12+s*10,'무료 AI 직원 진단')}return setScreen(freeResultHtml(),100,'무료 AI 직원 진단')}
function renderHome(){setScreen(`<div class="eyebrow">AI EMPLOYEE DIAGNOSIS · v6</div><h1>업종 하나가 아니라,<br>내 일 전체를 봅니다.</h1><p class="lead">본업·사업·콘텐츠처럼 업무영역이 여러 개여도 각 영역의 빈도와 협업 구조를 따로 반영해 자동화 우선순위를 찾습니다.</p><div class="modecards"><a class="modecard dark" href="#free"><span class="tag">무료 · 약 3분</span><h2>업무 하나 빠른 진단</h2><p>효과 잠재력 × 구축 준비도를 빠르게 확인합니다.</p><div class="go">무료 진단 시작 →</div></a><a class="modecard" href="#deep"><span class="tag">심층 · 약 6~10분</span><h2>내 업무 전체 TOP3</h2><p>여러 업무영역을 나눠 비교하고 실제 구축 순서를 정합니다.</p><div class="go">심층 진단 시작 →</div></a></div>`,0,'차팀장랩')}
function renderAreaDetail(){const a=deepState.areas[deepState.areaIndex];const complete=a.name&&a.activity&&a.collab;return setScreen(`<div class="eyebrow">업무영역 ${deepState.areaIndex+1} / ${deepState.areaCount}</div><h2>${a.imported?'무료진단에서 가져온 영역을 확인해주세요.':'이 업무영역을 알려주세요.'}</h2><div class="field"><label class="fieldlabel">업무영역 이름</label><input id="areaName" value="${esc(a.name)}" placeholder="예: 회사 PM, 차팀장 교육, 크리에이터"></div><div class="choicegroup"><div class="grouptitle">이 영역을 실제로 다루는 빈도</div>${choiceHtml(areaActivityChoices,a.activity,'area','activity')}</div><div class="choicegroup"><div class="grouptitle">이 영역에서 평소 일을 주고받는 사람 수</div>${choiceHtml(areaCollabChoices,a.collab,'area','collab')}<div class="helper">회사 전체 인원수가 아니라 이 업무영역에서 실제로 협업하는 사람 기준입니다.</div></div>${navHtml('다음',!complete)}`,18+deepState.areaIndex*5,'수강 전 심층진단')}

function renderScan(){const ref=deepState.scanRefs[deepState.scanCursor],a=areaById(ref.areaId),t=taskByRef(ref),q=scanQs[ref.key],val=t.scan[ref.key];const p=40+Math.round((deepState.scanCursor/Math.max(1,deepState.scanRefs.length))*28);return setScreen(`<div class="eyebrow">1차 비교 · ${deepState.scanCursor+1} / ${deepState.scanRefs.length}</div><div class="contextcard"><h3>${esc(t.name)}</h3><div class="contextmeta"><span>${esc(a.name)}</span><span>${areaActivityChoices.find(x=>x[1]===a.activity)?.[0]}</span><span>${areaCollabChoices.find(x=>x[1]===a.collab)?.[0]}</span></div></div><h2>${q.t}</h2><p class="sub">${q.sub}</p>${choiceHtml(q.a,val,'scan',ref.key)}${navHtml(deepState.scanCursor===deepState.scanRefs.length-1?'심층 후보 추리기 →':'다음',!val)}`,p,'수강 전 심층진단')}

function renderResult(){const ranked=rankFinal(),top=ranked.slice(0,3);const cards=top.map((x,i)=>`<div class="resultCard"><span class="quad ${x.q[1]}">${x.q[0]}</span><div class="rank"><div class="num">${i+1}</div><div class="rankmain"><h3>${esc(x.task.name)}</h3><p>${esc(x.area.name)} · ${x.automation}<br>${flowFor(x.task.name)}</p></div><div style="font-size:25px;font-weight:950;color:var(--purple)">${x.priority}</div></div><div class="twobar"><div class="metric"><b>효과 잠재력</b><div class="n">${x.impact}</div></div><div class="metric"><b>구축 가능성</b><div class="n">${x.feas}</div></div></div></div>`).join('');const areaWins=deepState.areas.map(a=>{const candidates=ranked.filter(x=>x.area.id===a.id);if(!candidates.length)return `<div class="areawinner"><b>${esc(a.name)}</b><p class="sub">1차 비교에서는 후순위였습니다.</p></div>`;const x=candidates[0];return `<div class="areawinner"><b>${esc(a.name)} → ${esc(x.task.name)}</b><p class="sub">효과 ${x.impact} · 구축 ${x.feas} · ${x.q[0]}</p></div>`}).join('');const first=top[0];const prep=first?.q[0]==='Foundation'?'바로 자동화하기보다 자료·기준을 먼저 정리한 뒤 구축합니다.':'실제 데이터로 1차 구축해 재실행하면서 기준을 보정합니다.';return setScreen(`<div class="resultHero"><div class="eyebrow">심층진단 결과 · v6</div><h2>내 업무 전체<br>자동화 우선순위 TOP3</h2><p>${deepState.areas.length}개 업무영역과 ${allTasks().length}개 반복업무를 분리해 비교했습니다.</p></div>${cards}<div class="sectiontitle">업무영역별 1순위</div>${areaWins}<div class="sectiontitle">1순위를 왜 먼저 하나요?</div><div class="note"><b>${esc(first?.task.name||'')}</b><br>${prep}<br><br>영역 빈도와 협업 구조까지 반영했기 때문에 단순히 “자주 하는 일”만 높은 점수를 받지 않습니다.</div><div class="sectiontitle">집중반에서의 구축 순서</div><div class="steps"><div class="stepitem"><b>1순위 업무</b>의 범위·입력·판단기준을 확정</div><div class="stepitem">실제 데이터로 <b>첫 실행</b> 후 사람 승인선 확인</div><div class="stepitem">다른 데이터로 <b>재실행</b>해 실패 원인 수정</div><div class="stepitem">2·3순위에 같은 원리를 <b>이전</b></div></div><div class="confidence">이 진단은 우선순위 결정을 위한 사전진단입니다. 실제 구축 가능성은 사용하는 서비스의 접근권한/API/데이터 형식에 따라 수업 전 최종 확인합니다.</div><div class="actions"><button class="btn soft" data-home>처음으로</button></div>`,100,'수강 전 심층진단')}
function renderDeep(){const ph=deepState.phase;if(ph==='intro')return setScreen(`<div class="eyebrow">심층진단 · 약 6~10분</div><h1>업종이 여러 개여도<br>섞어서 보지 않습니다.</h1><p class="lead">먼저 <b>업무영역</b>을 나누고, 영역별 활동 빈도와 협업 구조를 기록한 뒤 그 안의 반복업무를 비교합니다.</p><div class="note">예: 회사 PM(매일·5명 협업) / 크리에이터(주3회·혼자) / 교육사업(주1회·2명 협업)</div><div class="actions"><button class="btn orange" data-deep-start>심층진단 시작 →</button></div>`,2,'수강 전 심층진단');if(ph==='branch'){const a=deepState.areas[0],t=a.tasks[0];return setScreen(`<div class="eyebrow">무료진단에서 이어가기</div><h2>${esc(a.name)} · ${esc(t.name)}<br>이 기준을 가져갈까요?</h2><p class="lead">같은 업무영역이라면 이미 답한 내용은 반복하지 않습니다.</p><div class="actions" style="display:grid;gap:10px"><button class="btn orange" data-same-context>같은 영역으로 이어가기 →</button><button class="btn soft" data-new-context>다른 영역부터 새로 진단</button></div>`,6,'수강 전 심층진단')}if(ph==='area-count')return setScreen(`<div class="eyebrow">업무영역 나누기</div><h2>반복업무가 생기는<br>업무영역이 몇 개인가요?</h2><p class="sub">회사/사업/콘텐츠처럼 운영 방식과 협업 구조가 다르면 별도 영역으로 나눠주세요.</p><div class="countgrid">${[1,2,3,4,5].map(n=>`<button class="countbtn ${deepState.areaCount===n?'selected':''}" data-area-count="${n}">${n}</button>`).join('')}</div><div class="helper">최대 5개까지 진단합니다.</div>${navHtml('다음',!deepState.areaCount)}`,10,'수강 전 심층진단');if(ph==='free-extra-count')return setScreen(`<div class="eyebrow">다른 업무영역 확인</div><h2>${esc(deepState.areas[0].name)} 외에<br>다른 업무영역도 있나요?</h2><p class="sub">빈도나 협업 구조가 다르면 별도 영역으로 추가하는 게 정확합니다.</p><div class="countgrid">${[0,1,2,3,4].map(n=>`<button class="countbtn" data-extra-count="${n}">${n===0?'없음':'+'+n}</button>`).join('')}</div><div class="helper">예: 본업 + 크리에이터 + 교육사업이면 +2</div><div class="actions"><button class="btn soft" data-back>이전</button></div>`,16,'수강 전 심층진단');if(ph==='area-detail')return renderAreaDetail();if(ph==='tasks')return renderTaskEntry();if(ph==='scan')return renderScan();if(ph==='deepq')return renderDeepQuestion();if(ph==='result')return renderResult()}
function bind(){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const v=Number(b.dataset.val),target=b.dataset.target,key=b.dataset.key;if(target==='free'){freeState[key]=v;saveFree();renderFree()}else if(target==='area'){const a=deepState.areas[deepState.areaIndex];a[key]=v;saveDeep();renderDeep()}else if(target==='scan'){const ref=deepState.scanRefs[deepState.scanCursor];taskByRef(ref).scan[key]=v;saveDeep();renderDeep()}else if(target==='deepq'){const ref=deepState.deepRefs[deepState.deepCursor];taskByRef(ref).deep[key]=v;saveDeep();renderDeep()}});const fs=$('[data-free-start]');if(fs)fs.onclick=()=>{freeState.step=1;saveFree();renderFree()};const ds=$('[data-deep-start]');if(ds)ds.onclick=()=>{deepState.phase='area-count';saveDeep();renderDeep()};const df=$('[data-deep-from-free]');if(df)df.onclick=()=>{prepareFromFree();location.hash='deep-from-free'};const same=$('[data-same-context]');if(same)same.onclick=()=>{deepState.phase='area-detail';deepState.areaIndex=0;saveDeep();renderDeep()};const newer=$('[data-new-context]');if(newer)newer.onclick=()=>{deepState=freshDeep();deepState.phase='area-count';saveDeep();renderDeep()};document.querySelectorAll('[data-area-count]').forEach(b=>b.onclick=()=>{deepState.areaCount=Number(b.dataset.areaCount);deepState.areas=[];createAreas(deepState.areaCount);saveDeep();renderDeep()});document.querySelectorAll('[data-extra-count]').forEach(b=>b.onclick=()=>{const extra=Number(b.dataset.extraCount),target=1+extra;createAreas(target,1);deepState.areaCount=target;if(extra===0){deepState.phase='tasks';deepState.taskAreaIndex=0}else{deepState.phase='area-detail';deepState.areaIndex=1}saveDeep();renderDeep()});const areaInput=$('#areaName');if(areaInput){const sync=()=>{deepState.areas[deepState.areaIndex].name=areaInput.value.trim();saveDeep();const n=$('[data-next]');if(n)n.disabled=!(deepState.areas[deepState.areaIndex].name&&deepState.areas[deepState.areaIndex].activity&&deepState.areas[deepState.areaIndex].collab)};areaInput.oninput=sync;areaInput.onchange=sync}[['#freeJob','job'],['#freeTask','task']].forEach(([sel,key])=>{const i=$(sel);if(i){const sync=()=>{freeState[key]=i.value.trim();saveFree();const n=$('[data-next]');if(n)n.disabled=!freeState[key]};i.oninput=sync;i.onchange=sync}});const add=$('[data-add-task]');if(add)add.onclick=()=>addTask($('#taskInput')?.value);document.querySelectorAll('[data-quick-task]').forEach(b=>b.onclick=()=>addTask(b.dataset.quickTask));document.querySelectorAll('[data-remove-task]').forEach(b=>b.onclick=()=>{const a=deepState.areas[deepState.taskAreaIndex];a.tasks.splice(Number(b.dataset.removeTask),1);saveDeep();renderDeep()});const next=$('[data-next]');if(next)next.onclick=nextAction;const back=$('[data-back]');if(back)back.onclick=backAction;const home=$('[data-home]');if(home)home.onclick=()=>{location.hash=''}}
function addTask(name){name=(name||'').trim();if(!name)return;const a=deepState.areas[deepState.taskAreaIndex];if(a.tasks.some(t=>t.name===name))return;a.tasks.push({id:uid('t'),name,imported:false,scan:{freq:0,time:0,impact:0,pattern:0,handoff:0},deep:{rules:0,data:0,approval:0,digital:0}});saveDeep();renderDeep()}
function nextAction(){if(mode==='free'){if(freeState.step<8)freeState.step++;else freeState.step=9;saveFree();return renderFree()}const ph=deepState.phase;if(ph==='area-count'){if(!deepState.areaCount)return;deepState.phase='area-detail';deepState.areaIndex=0}else if(ph==='area-detail'){const a=deepState.areas[deepState.areaIndex];if(!a.name||!a.activity||!a.collab)return;if(deepState.source==='free'&&deepState.areaIndex===0&&deepState.areaCount===1)deepState.phase='free-extra-count';else if(deepState.areaIndex<deepState.areas.length-1)deepState.areaIndex++;else{deepState.phase='tasks';deepState.taskAreaIndex=0}}else if(ph==='tasks'){const a=deepState.areas[deepState.taskAreaIndex];if(a.tasks.length<1)return;if(deepState.taskAreaIndex<deepState.areas.length-1)deepState.taskAreaIndex++;else{if(allTasks().length<3)return;buildScanRefs();deepState.phase='scan'}}else if(ph==='scan'){const ref=deepState.scanRefs[deepState.scanCursor],t=taskByRef(ref);if(!t.scan[ref.key])return;if(deepState.scanCursor<deepState.scanRefs.length-1)deepState.scanCursor++;else{buildDeepRefs();deepState.phase='deepq'}}else if(ph==='deepq'){const ref=deepState.deepRefs[deepState.deepCursor],t=taskByRef(ref);if(!t.deep[ref.key])return;if(deepState.deepCursor<deepState.deepRefs.length-1)deepState.deepCursor++;else deepState.phase='result'}saveDeep();renderDeep()}
function backAction(){if(mode==='free'){freeState.step=Math.max(0,freeState.step-1);saveFree();return renderFree()}const ph=deepState.phase;if(ph==='area-count')deepState.phase='intro';else if(ph==='area-detail'){if(deepState.areaIndex>0)deepState.areaIndex--;else deepState.phase=deepState.source==='free'?'branch':'area-count'}else if(ph==='free-extra-count'){deepState.phase='area-detail';deepState.areaIndex=0}else if(ph==='tasks'){if(deepState.taskAreaIndex>0)deepState.taskAreaIndex--;else{deepState.phase='area-detail';deepState.areaIndex=deepState.areas.length-1}}else if(ph==='scan'){if(deepState.scanCursor>0)deepState.scanCursor--;else{deepState.phase='tasks';deepState.taskAreaIndex=deepState.areas.length-1}}else if(ph==='deepq'){if(deepState.deepCursor>0)deepState.deepCursor--;else{deepState.phase='scan';deepState.scanCursor=deepState.scanRefs.length-1}}else if(ph==='result'){deepState.phase='deepq';deepState.deepCursor=deepState.deepRefs.length-1}saveDeep();renderDeep()}
function route(){const h=location.hash.replace('#','');if(h==='free'){mode='free';restoreFree();renderFree()}else if(h==='deep-from-free'){mode='deep';if(deepState.source!=='free'||deepState.phase==='intro')prepareFromFree();renderDeep()}else if(h==='deep'){mode='deep';restoreDeep();if(deepState.source==='free')deepState=freshDeep();renderDeep()}else{mode='home';renderHome()}}
window.addEventListener('hashchange',route);route();
</script></body></html>
