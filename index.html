rgin:15px 0}.actions{display:flex;gap:10px;margin-top:26px}.btn{border:0;border-radius:14px;min-height:50px;padding:14px 16px;font-weight:950}.btn.main{flex:1;background:#191816;color:#fff}.btn.orange{flex:1;background:var(--orange);color:#fff}.btn.soft{background:#EFE9E2;color:#3F3A35}.btn.purple{flex:1;background:var(--purple);color:#fff}.btn:disabled{opacity:.35}.homeHero{padding:38px 4px 16px}.modegrid{display:grid;gap:14px;margin-top:24px}.mode{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:21px;box-shadow:var(--shadow)}.mode.dark{background:linear-gradient(135deg,#191816,#2D2745);color:#fff;border:0}.tag{display:inline-block;border-radius:999px;padding:7px 10px;background:var(--purple-soft);color:var(--purple);font-size:11px;font-weight:950;margin-bottom:11px}.mode.dark .tag{background:rgba(255,255,255,.13);color:#FFB498}.mode h2{font-size:27px;margin-bottom:9px}.mode p{margin:0;color:var(--muted);line-height:1.55}.mode.dark p{color:#D9D5E1}.go{font-weight:950;margin-top:17px}.signalgrid{display:grid;gap:10px;margin-top:18px}.signal{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.signal .ico{width:46px;height:46px;border-radius:14px;background:var(--orange-soft);display:grid;place-items:center;font-size:24px}.signal b{display:block;font-size:15px;margin-bottom:4px}.signal span{font-size:12px;color:var(--muted);line-height:1.5}.field{margin:18px 0}.field label,.fieldlabel{display:block;font-size:13px;font-weight:950;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px 15px;outline:0;font-size:16px}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(107,85,232,.09)}.countgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.countbtn{border:1.5px solid var(--line);background:#fff;border-radius:15px;min-height:54px;font-weight:950}.countbtn.selected{border-color:var(--purple);background:var(--purple-soft);color:var(--purple)}.areaNames{display:grid;gap:9px;margin-top:16px}.rowcard{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;margin-top:11px}.rowtop{display:flex;gap:8px;align-items:center}.rowtop select{width:112px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.rowtop input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px}.remove{border:0;background:transparent;color:#9A9188;font-weight:950;font-size:18px;padding:6px}.rowmeta{display:grid;grid-template-columns:110px 1fr;gap:8px;margin-top:9px}.rowmeta select,.rowmeta input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.signalChecks{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.sigbtn{border:1px solid var(--line);background:#F8F4F0;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:900;color:#5E5852}.sigbtn.on{border-color:var(--orange);background:var(--orange-soft);color:#A84C2E}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.toolbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 12px;font-size:12px;font-weight:900}.candidate{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;margin-top:11px}.candhead{display:flex;gap:10px;align-items:flex-start}.candcheck{width:25px;height:25px;border-radius:8px;border:1.5px solid #C9C0B7;display:grid;place-items:center;flex:none;margin-top:1px}.candidate.selected .candcheck{background:var(--purple);border-color:var(--purple);color:#fff}.candmain{flex:1}.candmain b{display:block;font-size:15px;margin-bottom:4px}.candmain small{font-size:12px;color:var(--muted);line-height:1.45}.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.pill{background:#F1ECE6;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:900}.scoreControls{display:grid;gap:10px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}.scoreRow{display:grid;grid-template-columns:88px 1fr;gap:9px;align-items:center}.scoreRow>span{font-size:12px;font-weight:900}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.seg.three{grid-template-columns:repeat(3,1fr)}.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 5px;font-size:10px;font-weight:900}.seg button.on{border-color:var(--purple);background:var(--purple-soft);color:var(--purple)}.resultHero{background:linear-gradient(135deg,#191816,#2D2745);color:#fff;border-radius:24px;padding:24px;margin-bottom:15px}.resultHero .eyebrow{color:#FFB498}.resultHero p{color:#DAD6E2;line-height:1.6;margin:0}.resultCard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}.rank{display:flex;gap:12px;align-items:flex-start}.num{width:34px;height:34px;border-radius:11px;background:#191816;color:#fff;display:grid;place-items:center;font-weight:950;flex:none}.rankmain{flex:1}.rankmain h3{margin:0 0 5px}.rankmain p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.metric{background:#F7F3EF;border-radius:14px;padding:11px}.metric b{font-size:10px;display:block;margin-bottom:5px}.metric strong{font-size:21px}.sectiontitle{margin:24px 0 10px;font-size:18px;font-weight:950;letter-spacing:-.035em}.steps{display:grid;gap:8px}.step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.step span:first-child{width:28px;height:28px;border-radius:9px;background:#191816;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:950}.step b{display:block;font-size:12px;margin-bottom:4px}.step p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}.contextcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:11px 0}.contextmeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.contextmeta span{font-size:11px;background:#F2EDE7;border-radius:999px;padding:7px 9px}.choices{display:grid;gap:9px;margin-top:17px}.choice{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.choice.selected{border-color:var(--purple);background:var(--purple-soft)}.choice b{font-size:14px}.choice small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.4}.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid #CBC2B9;display:grid;place-items:center;flex:none}.choice.selected .dot{background:var(--purple);border-color:var(--purple);color:#fff}.taskitem{display:flex;gap:8px;align-items:center;background:#F7F2EC;border-radius:14px;padding:11px;margin-top:8px}.taskitem .grow{flex:1}.taskitem b{display:block;font-size:13px}.taskitem small{font-size:11px;color:var(--muted)}.locked{font-size:10px;background:#E9E4FF;color:var(--purple);padding:5px 7px;border-radius:999px}.quad{display:inline-block;font-size:10px;font-weight:950;padding:7px 9px;border-radius:999px;margin-bottom:8px}.quad.quick{background:var(--green-soft);color:#246B4C}.quad.foundation{background:var(--yellow-soft);color:#946015}.quad.easy{background:#EEF0FF;color:#5D57A9}.quad.later{background:#F1EDE8;color:#77706A}.axisgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.axis{background:#F7F3EF;border-radius:14px;padding:11px}.axis b{display:block;font-size:10px;margin-bottom:4px}.axis strong{font-size:24px}.areawinner{border-left:4px solid var(--orange);padding-left:11px;margin:13px 0}.copybox{white-space:pre-wrap;background:#191816;color:#F5F1EA;border-radius:16px;padding:15px;font-size:11px;line-height:1.55;max-height:300px;overflow:auto}.confidence{background:var(--purple-soft);color:#5E5778;border-radius:16px;padding:14px;font-size:12px;line-height:1.55}.divider{height:1px;background:var(--line);margin:18px 0}
@media(max-width:560px){.wrap{padding-left:11px;padding-right:11px}.card{padding:23px 16px;border-radius:22px}.rowtop{display:grid;grid-template-columns:100px 1fr 28px}.rowmeta{grid-template-columns:105px 1fr}.metricgrid,.axisgrid{grid-template-columns:1fr 1fr}.scoreRow{grid-template-columns:75px 1fr}.seg button{font-size:9px;padding:9px 2px}}

<body>
<div class="app"><header class="top"><div class="topin"><div class="brandrow"><span class="logo">차</span><span class="brand" id="brandTitle">차팀장랩</span><span class="version">v7</span></div><div class="progress"><i id="bar"></i></div></div></header><main class="wrap"><section class="card" id="screen"></section><div class="footer">차팀장랩 · AI는 초안·정리·반복 처리를 맡고, 중요한 판단과 최종 승인은 사람이 합니다.</div></main></div>
<script>
const $=s=>document.querySelector(s);
const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,n));
const uid=(p='x')=>p+Math.random().toString(36).slice(2,8);
const FREE_KEY='cha-ai-free-v7', DEEP_KEY='cha-ai-deep-v7';
const SIGS={copy:['📋','같은 말·문구를 또 친다'],number:['🔢','숫자를 다른 곳에 옮긴다'],apps:['🔀','앱·사이트를 여러 개 오간다'],periodic:['🔁','매일·매주 비슷하게 한다'],risk:['⚠️','까먹거나 늦으면 문제가 난다']};
const FREQ_LABEL={1:'월 1~2회/가끔',2:'주 1회',3:'주 2~4회',4:'거의 매일'};
const RISK_LABEL={1:'낮음',2:'지연·번거로움',3:'고객·매출·마감 영향'};
const freqWeekly={1:.4,2:1,3:3,4:5};
let mode='home';
function emptySignals(){return {copy:false,number:false,apps:false,periodic:false,risk:false}}
function blankRow(areaId=''){return {id:uid('r'),time:'오전',areaId,task:'',minutes:15,signals:emptySignals(),selected:false,freq:0,risk:0}}
let freeState={phase:'intro',areaCount:1,areas:[{id:uid('a'),name:''}],rows:[blankRow()],resultSeen:false,candidatesInitialized:false};
function freshDeep(){return {source:'direct',phase:'intro',areas:[],areaIndex:0,taskAreaIndex:0,scanRefs:[],scanCursor:0,deepRefs:[],deepCursor:0}}
let deepState=freshDeep();
function saveFree(){try{localStorage.setItem(FREE_KEY,JSON.stringify(freeState))}catch(e){}}
function restoreFree(){try{const x=JSON.parse(localStorage.getItem(FREE_KEY)||'null');if(x&&x.phase)freeState=x}catch(e){}}
function saveDeep(){try{localStorage.setItem(DEEP_KEY,JSON.stringify(deepState))}catch(e){}}
function restoreDeep(){try{const x=JSON.parse(localStorage.getItem(DEEP_KEY)||'null');if(x&&x.phase)deepState=x}catch(e){}}
function setScreen(html,pct=0,title='차팀장랩'){const sc=$('#screen'),pb=$('#bar'),bt=$('#brandTitle');sc.innerHTML=html;pb.style.width=pct+'%';bt.textContent=title;try{scrollTo({top:0,behavior:'instant'})}catch(e){scrollTo(0,0)}bind()}
function nav(label='다음',disabled=false){return `<div class="actions"><button class="btn soft" data-back>이전</button><button class="btn main" data-next ${disabled?'disabled':''}>${label}</button></div>`}
function choice(items,current,target,key){return `<div class="choices">${items.map(([label,val,small=''])=>`<button class="choice ${Number(current)===Number(val)?'selected':''}" data-choice data-target="${target}" data-key="${key}" data-val="${val}"><div><b>${label}</b>${small?`<small>${small}</small>`:''}</div><span class="dot">${Number(current)===Number(val)?'✓':''}</span></button>`).join('')}</div>`}
function renderHome(){setScreen(`<div class="homeHero"><div class="eyebrow">차팀장 AI 업무 시스템</div><h1>뭘 맡길지 찾고,<br>무엇부터 만들지 정합니다.</h1><p class="lead">무료는 <b>숨은 반복업무 발견</b>, 수강 전 심층진단은 <b>구축 우선순위 결정</b>에 집중합니다.</p></div><div class="modegrid"><a class="mode" href="#free"><span class="tag">무료 · 약 5~8분</span><h2>숨은 반복업무 찾기</h2><p>5가지 신호로 어제 하루를 되짚어 AI에게 맡길 후보를 직접 찾아냅니다.</p><div class="go">무료 체크리스트 시작 →</div></a><a class="mode dark" href="#deep"><span class="tag">수강 전 · 약 8~15분</span><h2>구축 우선순위 심층진단</h2><p>업무영역·빈도·협업구조까지 나눠 효과와 구축 가능성을 비교합니다.</p><div class="go">심층진단 시작 →</div></a></div>`,0)}
function signalCards(){return Object.entries(SIGS).map(([k,[ico,t]])=>`<div class="signal"><div class="ico">${ico}</div><div><b>${t}</b><span>${({copy:'문의 답장·안내문·설명처럼 비슷한 문장을 다시 쓰는 일',number:'매출·예약·정산 숫자를 화면에서 문서나 장부로 옮기는 일',apps:'같은 정보를 찾으려고 여러 화면을 오가며 확인하는 일',periodic:'날짜만 바뀌고 내용·절차는 거의 같은 일',risk:'리마인드·재고·마감처럼 놓치면 손해나 불편이 생기는 일'})[k]}</span></div></div>`).join('')}
function renderFree(){const p=freeState.phase;if(p==='intro')return setScreen(`<div class="eyebrow">무료 · 숨은 반복업무 찾기</div><h1>“자동화할 일이 없는데요?”<br>여기서 시작합니다.</h1><p class="lead">반복업무를 먼저 적으라고 하지 않습니다. <b>어제 하루를 시간순으로 돌아보면서</b> 숨은 반복을 찾습니다.</p><div class="note">완성하면: 내 반복업무 후보 TOP5 · 주간 반복시간 추정 · AI에게 맡길 방향 · 7칸 설계 원리</div><div class="actions"><button class="btn orange" data-free-start>무료 체크리스트 시작 →</button></div>`,2,'무료 반복업무 찾기');
if(p==='signals')return setScreen(`<div class="eyebrow">01 · 반복업무 신호</div><h2>이 5가지가 보이면<br>반복업무 후보입니다.</h2><p class="sub">“그냥 원래 하던 일”이라고 넘기던 업무가 대부분 여기에 걸립니다.</p><div class="signalgrid">${signalCards()}</div>${nav('어제 하루 기록하기 →')}`,12,'무료 반복업무 찾기');
if(p==='areas'){const fields=freeState.areas.map((a,i)=>`<div class="field"><label>업무영역 ${i+1}</label><input data-free-area="${i}" value="${esc(a.name)}" placeholder="${i===0?'예: 회사 PM, 온라인 쇼핑몰, 크리에이터':'예: 교육사업, 콘텐츠 운영'}"></div>`).join('');return setScreen(`<div class="eyebrow">02 · 업무영역</div><h2>어제 하루에<br>몇 개의 역할로 일했나요?</h2><p class="sub">회사·사업·콘텐츠처럼 일이 섞여 있다면 영역을 나눠두면 뒤에서 후보가 섞이지 않습니다.</p><div class="countgrid">${[1,2,3].map(n=>`<button class="countbtn ${freeState.areaCount===n?'selected':''}" data-free-area-count="${n}">${n}개</button>`).join('')}</div><div class="areaNames">${fields}</div>${nav('하루 기록표 만들기 →',freeState.areas.some(a=>!a.name.trim()))}`,22,'무료 반복업무 찾기')}
if(p==='log')return renderLog();
if(p==='candidates')return renderCandidates();
if(p==='score')return renderCandidateScore();
if(p==='result')return renderFreeResult();}

if(p==='area-count')return setScreen(`<div class="eyebrow">01 · 업무영역</div><h2>반복업무가 생기는<br>업무영역이 몇 개인가요?</h2><p class="sub">회사/사업/콘텐츠처럼 빈도나 협업 구조가 다르면 별도 영역입니다.</p><div class="countgrid">${[1,2,3,4,5].map(n=>`<button class="countbtn ${deepState.areas.length===n?'selected':''}" data-deep-area-count="${n}">${n}개</button>`).join('')}</div>${nav('영역별 구조 입력 →',!deepState.areas.length)}`,10,'수강 전 구축진단');
if(p==='area-detail')return renderAreaDetail();if(p==='tasks')return renderDeepTasks();if(p==='scan')return renderScan();if(p==='deepq')return renderDeepQ();if(p==='result')return renderDeepResult();}
function areaActivityChoices(){return [['거의 매일',5],['주 2~4일',4],['주 1일',3],['월 2~3일',2],['가끔',1]]}
function collabChoices(){return [['6명 이상·여러 팀',5],['4~5명',4],['2~3명',3],['1명과 협업',2],['거의 혼자',1]]}
function renderAreaDetail(){const a=deepState.areas[deepState.areaIndex];return setScreen(`<div class="eyebrow">02 · 영역 ${deepState.areaIndex+1} / ${deepState.areas.length}</div><h2>이 영역은 얼마나 자주,<br>몇 명과 굴러가나요?</h2><div class="field"><label>업무영역 이름</label><input id="deepAreaName" value="${esc(a.name)}" placeholder="예: 회사 PM, 크리에이터, 교육사업"></div><div class="fieldlabel">이 영역에서 일하는 빈도</div>${choice(areaActivityChoices(),a.activity,'area','activity')}<div class="fieldlabel" style="margin-top:20px">평소 함께 일하는 사람/팀 수</div>${choice(collabChoices(),a.collab,'area','collab')}${nav('다음',!(a.name&&a.activity&&a.collab))}`,15+deepState.areaIndex*6,'수강 전 구축진단')}
function renderDeepTasks(){const a=deepState.areas[deepState.taskAreaIndex],total=allTasks().length;const items=a.tasks.map((t,i)=>`<div class="taskitem"><div class="grow"><b>${esc(t.name)}</b><small>${t.imported?'무료 체크리스트에서 가져옴':'직접 추가'}</small></div>${t.imported?'<span class="locked">승계</span>':''}<button class="remove" data-remove-deep-task="${i}">×</button></div>`).join('');return setScreen(`<div class="eyebrow">03 · 반복업무 ${deepState.taskAreaIndex+1}/${deepState.areas.length}</div><h2>${esc(a.name)}에서<br>비교할 업무를 확인하세요.</h2><p class="sub">무료에서 찾은 후보는 그대로 두고, 빠진 업무만 추가하세요. 전체 3개 이상이면 비교할 수 있습니다.</p><div class="field"><input id="deepTaskInput" placeholder="예: 상담 후속관리"></div><div class="toolbar"><button class="toolbtn" data-add-deep-task>+ 업무 추가</button></div>${items}<div class="info">현재 전체 ${total}개 업무</div>${nav(deepState.taskAreaIndex===deepState.areas.length-1?'1차 비교 시작 →':'다음 영역 →',a.tasks.length<1||(deepState.taskAreaIndex===deepState.areas.length-1&&total<3))}`,34,'수강 전 구축진단')}
function allTasks(){return deepState.areas.flatMap(a=>a.tasks.map(t=>({a,t})))}
function areaById(id){return deepState.areas.find(a=>a.id===id)}
function taskByRef(ref){return areaById(ref.areaId)?.tasks.find(t=>t.id===ref.taskId)}
function buildScanRefs(){const refs=[];deepState.areas.forEach(a=>a.tasks.forEach(t=>Object.keys(scanQs).forEach(key=>{if(!t.scan[key])refs.push({areaId:a.id,taskId:t.id,key})})));deepState.scanRefs=refs;deepState.scanCursor=0}
function renderScan(){if(!deepState.scanRefs.length){buildDeepRefs();deepState.phase='deepq';saveDeep();return renderDeep()}const ref=deepState.scanRefs[deepState.scanCursor],a=areaById(ref.areaId),t=taskByRef(ref),q=scanQs[ref.key],pct=38+Math.round(deepState.scanCursor/Math.max(1,deepState.scanRefs.length)*28);return setScreen(`<div class="eyebrow">04 · 1차 비교 ${deepState.scanCursor+1}/${deepState.scanRefs.length}</div><div class="contextcard"><h3>${esc(t.name)}</h3><div class="contextmeta"><span>${esc(a.name)}</span><span>영역빈도 ${a.activity}/5</span><span>협업규모 ${a.collab}/5</span></div></div><h2>${q.t}</h2><p class="sub">${q.sub}</p>${choice(q.a,t.scan[ref.key],'scan',ref.key)}${nav(deepState.scanCursor===deepState.scanRefs.length-1?'심층 후보 추리기 →':'다음',!t.scan[ref.key])}`,pct,'수강 전 구축진단')}
function effectScore(a,t){const s=t.scan;return Math.round((s.freq*25+s.time*20+s.impact*25+s.handoff*15+a.activity*10+a.collab*5)/5)}
function readinessPre(t){return Math.round((t.scan.pattern||1)/5*100)}
function buildDeepRefs(){const perArea=new Map();deepState.areas.forEach(a=>{const sorted=a.tasks.map(t=>({a,t,e:effectScore(a,t)})).sort((x,y)=>y.e-x.e);if(sorted[0])perArea.set(a.id,sorted[0].t.id)});const all=allTasks().map(({a,t})=>({a,t,e:effectScore(a,t)})).sort((x,y)=>y.e-x.e);const selected=[];perArea.forEach((tid,aid)=>{const x=all.find(z=>z.t.id===tid);if(x)selected.push(x)});for(const x of all){if(selected.length>=Math.min(6,Math.max(4,deepState.areas.length)))break;if(!selected.some(z=>z.t.id===x.t.id))selected.push(x)};const refs=[];selected.forEach(({a,t})=>Object.keys(deepQs).forEach(key=>{if(!t.deep[key])refs.push({areaId:a.id,taskId:t.id,key})}));deepState.deepRefs=refs;deepState.deepCursor=0}
function renderDeepQ(){if(!deepState.deepRefs.length){deepState.phase='result';saveDeep();return renderDeep()}const ref=deepState.deepRefs[deepState.deepCursor],a=areaById(ref.areaId),t=taskByRef(ref),q=deepQs[ref.key],pct=70+Math.round(deepState.deepCursor/Math.max(1,deepState.deepRefs.length)*25);return setScreen(`<div class="eyebrow">05 · 구축가능성 ${deepState.deepCursor+1}/${deepState.deepRefs.length}</div><div class="contextcard"><h3>${esc(t.name)}</h3><div class="contextmeta"><span>${esc(a.name)}</span><span>효과 잠재력 ${effectScore(a,t)}</span></div></div><h2>${q.t}</h2><p class="sub">${q.sub}</p>${choice(q.a,t.deep[ref.key],'deepq',ref.key)}${nav(deepState.deepCursor===deepState.deepRefs.length-1?'최종 구축순위 보기 →':'다음',!t.deep[ref.key])}`,pct,'수강 전 구축진단')}
function readinessScore(a,t){const d=t.deep,s=t.scan;if(!d.rules||!d.data||!d.approval||!d.digital)return 0;let base=(s.pattern*20+d.rules*25+d.data*20+d.approval*15+d.digital*20)/5;const complexity=((s.handoff-1)+(a.collab-1))/8*10;return Math.round(clamp(base-complexity))}
function quadrant(e,r){if(e>=65&&r>=65)return ['Quick Win','quick','효과도 크고 지금 구축하기도 좋음'];if(e>=65)return ['Foundation','foundation','효과는 크지만 자료·기준부터 정리'];if(r>=65)return ['Easy Win','easy','쉽게 시작할 수 있는 보조/초안 업무'];return ['Later','later','지금은 표준화·정리부터']}
function buildMode(r){return r>=80?'반자동 워크플로우 후보':r>=60?'AI 초안 + 사람 승인':'AI 보조부터 시작'}
function roleFor(name){const n=name.toLowerCase();if(/문의|상담|고객|cs|답변|리뷰/.test(n))return '고객관리 AI 직원';if(/콘텐츠|블로그|인스타|릴스|유튜브|레퍼런스/.test(n))return '콘텐츠 AI 직원';if(/예약|일정|리마인드/.test(n))return '예약관리 AI 직원';if(/메일/.test(n))return '메일비서 AI 직원';if(/매출|정산|재고|발주|결제/.test(n))return '운영정리 AI 직원';return '업무보조 AI 직원'}
function scoredTasks(){return allTasks().map(({a,t})=>{const e=effectScore(a,t),r=readinessScore(a,t),priority=Math.round(e*.62+r*.38),q=quadrant(e,r);return {a,t,e,r,priority,q}}).filter(x=>x.r>0).sort((x,y)=>y.priority-x.priority)}
function sevenBuildCard(x){const {a,t}=x;return [['범위',`${a.name}에서 “${t.name}”이 시작되는 조건과 완료 조건을 적기`],['입력',t.deep.data>=4?'현재 정리된 실제 자료 3~5건을 입력으로 연결':'흩어진 자료를 한곳에 모으고 실제 예시 3건 만들기'],['결과',`${roleFor(t.name)}이 매번 같은 형태의 초안/정리 결과를 만들게 하기`],['판단',t.deep.rules>=4?'현재 판단기준을 체크리스트로 고정':'내가 무엇을 보고 결정하는지 예외까지 말로 꺼내기'],['순서',autoDirection({task:t.name,signals:t.freeSignals||emptySignals()})],['사람확인',t.deep.approval>=4?'예외·사실확인·최종승인만 사람이 담당':'AI는 보조/초안까지만 맡기고 중요 판단은 사람이 유지'],['저장·다음행동','결과·수정이유를 같은 위치에 저장하고 다음 데이터로 재실행']];}
function renderDeepResult(){const list=scoredTasks(),top=list.slice(0,3);if(!top.length)return setScreen(`<h2>심층 답변이 부족합니다.</h2><p class="sub">뒤로 돌아가 후보 질문을 완료해주세요.</p>${nav('돌아가기')}`,95,'수강 전 구축진단');const cards=top.map((x,i)=>`<div class="resultCard"><span class="quad ${x.q[1]}">${x.q[0]}</span><div class="rank"><div class="num">${i+1}</div><div class="rankmain"><h3>${esc(x.t.name)}</h3><p>${esc(x.a.name)} · ${roleFor(x.t.name)}<br>${x.q[2]}</p></div></div><div class="axisgrid"><div class="axis"><b>효과 잠재력</b><strong>${x.e}</strong></div><div class="axis"><b>구축 가능성</b><strong>${x.r}</strong></div></div><div class="info" style="margin-bottom:0"><b>${buildMode(x.r)}</b></div></div>`).join('');const winners=deepState.areas.map(a=>list.filter(x=>x.a.id===a.id)[0]).filter(Boolean).map(x=>`<div class="areawinner"><b>${esc(x.a.name)} 1순위</b><div>${esc(x.t.name)} · 효과 ${x.e} / 구축 ${x.r}</div></div>`).join('');const first=top[0];const steps=sevenBuildCard(first).map(([b,p],i)=>`<div class="step"><span>${i+1}</span><div><b>${b}</b><p>${esc(p)}</p></div></div>`).join('');const summary=`[차팀장 구축 우선순위 진단]\n\nTOP1 ${first.a.name} / ${first.t.name}\n효과 ${first.e} · 구축 ${first.r} · ${first.q[0]}\n운영방식: ${buildMode(first.r)}\n\n${sevenBuildCard(first).map(([b,p],i)=>`${i+1}. ${b}: ${p}`).join('\n')}`;return setScreen(`<div class="resultHero"><div class="eyebrow">수강 전 심층진단 결과</div><h2>먼저 구축할 AI 업무<br>TOP ${top.length}</h2><p>협업이 많으면 <b>자동화 가치</b>는 올라가지만 동시에 <b>구축 복잡도</b>도 올라가도록 두 축에 따로 반영했습니다.</p></div>${cards}<div class="sectiontitle">업무영역별 1순위</div><div class="resultCard">${winners}</div><div class="sectiontitle">1순위 7칸 업무카드 초안</div><div class="steps">${steps}</div><div class="sectiontitle">수업에서는 여기서 끝내지 않습니다</div><div class="confidence">1순위를 실제 데이터로 구축 → 다른 데이터로 재실행 → 실패 원인과 수정 이유 기록 → 2·3순위 업무에 같은 원리를 이식하는 순서로 갑니다.</div><div class="sectiontitle">진단 요약</div><div class="copybox">${esc(summary)}</div><div class="actions"><button class="btn purple" data-copy-summary>진단결과 복사</button><button class="btn soft" data-home>처음으로</button></div>`,100,'수강 전 구축진단')}
function addDeepTask(){const input=$('#deepTaskInput'),name=(input?.value||'').trim();if(!name)return;const a=deepState.areas[deepState.taskAreaIndex];if(a.tasks.some(t=>t.name===name))return;a.tasks.push({id:uid('t'),name,imported:false,scan:{freq:0,time:0,impact:0,pattern:0,handoff:0},deep:{rules:0,data:0,approval:0,digital:0}});saveDeep();renderDeep()}
function nextFree(){const p=freeState.phase;if(p==='signals')freeState.phase='areas';else if(p==='areas')freeState.phase='log';else if(p==='log'){freeState.candidatesInitialized=false;freeState.phase='candidates';}else if(p==='candidates')freeState.phase='score';else if(p==='score')freeState.phase='result';saveFree();renderFree()}

function nextDeep(){const p=deepState.phase;if(p==='area-count'){deepState.phase='area-detail';deepState.areaIndex=0}else if(p==='area-detail'){const a=deepState.areas[deepState.areaIndex];if(!a.name||!a.activity||!a.collab)return;if(deepState.areaIndex<deepState.areas.length-1)deepState.areaIndex++;else{deepState.phase='tasks';deepState.taskAreaIndex=0}}else if(p==='tasks'){const a=deepState.areas[deepState.taskAreaIndex];if(!a.tasks.length)return;if(deepState.taskAreaIndex<deepState.areas.length-1)deepState.taskAreaIndex++;else{if(allTasks().length<3)return;buildScanRefs();deepState.phase=deepState.scanRefs.length?'scan':'deepq';if(!deepState.scanRefs.length)buildDeepRefs()}}else if(p==='scan'){const ref=deepState.scanRefs[deepState.scanCursor],t=taskByRef(ref);if(!t.scan[ref.key])return;if(deepState.scanCursor<deepState.scanRefs.length-1)deepState.scanCursor++;else{buildDeepRefs();deepState.phase=deepState.deepRefs.length?'deepq':'result'}}else if(p==='deepq'){const ref=deepState.deepRefs[deepState.deepCursor],t=taskByRef(ref);if(!t.deep[ref.key])return;if(deepState.deepCursor<deepState.deepRefs.length-1)deepState.deepCursor++;else deepState.phase='result'}saveDeep();renderDeep()}
function backDeep(){const p=deepState.phase;if(p==='area-count')deepState.phase='intro';else if(p==='area-detail'){if(deepState.areaIndex>0)deepState.areaIndex--;else deepState.phase=deepState.source==='free'?'import-review':'area-count'}else if(p==='tasks'){if(deepState.taskAreaIndex>0)deepState.taskAreaIndex--;else{deepState.phase='area-detail';deepState.areaIndex=deepState.areas.length-1}}else if(p==='scan'){if(deepState.scanCursor>0)deepState.scanCursor--;else{deepState.phase='tasks';deepState.taskAreaIndex=deepState.areas.length-1}}else if(p==='deepq'){if(deepState.deepCursor>0)deepState.deepCursor--;else{deepState.phase=deepState.scanRefs.length?'scan':'tasks';deepState.scanCursor=Math.max(0,deepState.scanRefs.length-1)}}else if(p==='result'){deepState.phase='deepq';deepState.deepCursor=Math.max(0,deepState.deepRefs.length-1)}saveDeep();renderDeep()}
function freeSummaryText(){const ranked=selectedCandidates().map(r=>({...r,priority:freePriority(r),weekly:weeklyMinutes(r)})).sort((a,b)=>b.priority-a.priority).slice(0,5);const parts=ranked.map((r,i)=>`${i+1}. ${r.task}\n- 주간 반복시간 추정 ${r.weekly}분\n- 발견 우선도 ${r.priority}\n- 맡길 방향: ${autoDirection(r)}`);return `[차팀장 숨은 반복업무 찾기]\n\n${parts.join('\n\n')}\n\n[7칸 원리]\n범위 → 입력 → 결과 → 판단 → 순서 → 사람확인 → 저장·다음행동`;}
function exportFreeCsv(){const rows=freeState.rows.filter(r=>r.task.trim());const head=['시간대','업무영역','한 일','소요분','복붙','숫자이동','앱이동','주기반복','누락위험'];const body=rows.map(r=>{const a=freeState.areas.find(x=>x.id===r.areaId);return [r.time,a?.name||'',r.task,r.minutes,...['copy','number','apps','periodic','risk'].map(k=>r.signals[k]?'Y':'')];});const escCsv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[head,...body].map(row=>row.map(escCsv).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='차팀장_하루기록_반복업무.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

const nd=$('[data-new-deep]');if(nd)nd.onclick=()=>{deepState=freshDeep();deepState.phase='area-count';saveDeep();renderDeep()};
const df=$('[data-deep-from-free]');if(df)df.onclick=()=>{if(prepareDeepFromFree())location.hash='deep-from-free'};
document.querySelectorAll('[data-free-area-count]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.freeAreaCount),old=freeState.areas;freeState.areaCount=n;freeState.areas=Array.from({length:n},(_,i)=>old[i]||{id:uid('a'),name:''});freeState.rows.forEach(r=>{if(!freeState.areas.some(a=>a.id===r.areaId))r.areaId=freeState.areas[0].id});saveFree();renderFree()});
document.querySelectorAll('[data-free-area]').forEach(i=>{i.oninput=()=>{freeState.areas[Number(i.dataset.freeArea)].name=i.value.trim();saveFree();const n=$('[data-next]');if(n)n.disabled=freeState.areas.some(a=>!a.name.trim())}});
const fill=$('[data-fill-example]');if(fill)fill.onclick=()=>{freeState.rows=exampleRowsFor(freeState.areas[0]?.name||'');saveFree();renderFree()};
const ar=$('[data-add-row]');if(ar)ar.onclick=()=>{freeState.rows.push(blankRow(freeState.areas[0]?.id));saveFree();renderFree()};
document.querySelectorAll('[data-remove-row]').forEach(b=>b.onclick=()=>{if(freeState.rows.length>1)freeState.rows.splice(Number(b.dataset.removeRow),1);saveFree();renderFree()});
document.querySelectorAll('[data-row-time]').forEach(i=>i.onchange=()=>{freeState.rows[Number(i.dataset.rowTime)].time=i.value;saveFree()});
document.querySelectorAll('[data-row-area]').forEach(i=>i.onchange=()=>{freeState.rows[Number(i.dataset.rowArea)].areaId=i.value;saveFree()});
document.querySelectorAll('[data-row-task]').forEach(i=>i.oninput=()=>{freeState.rows[Number(i.dataset.rowTask)].task=i.value;saveFree();const valid=freeState.rows.filter(r=>r.task.trim()&&Number(r.minutes)>0).length>=3;const n=$('[data-next]');if(n)n.disabled=!valid});
document.querySelectorAll('[data-row-min]').forEach(i=>i.oninput=()=>{freeState.rows[Number(i.dataset.rowMin)].minutes=Number(i.value)||0;saveFree();const valid=freeState.rows.filter(r=>r.task.trim()&&Number(r.minutes)>0).length>=3;const n=$('[data-next]');if(n)n.disabled=!valid});
document.querySelectorAll('[data-row-sig]').forEach(b=>b.onclick=()=>{const r=freeState.rows[Number(b.dataset.rowSig)];r.signals[b.dataset.sig]=!r.signals[b.dataset.sig];saveFree();renderFree()});
document.querySelectorAll('[data-toggle-candidate]').forEach(b=>b.onclick=()=>{const r=freeState.rows.find(x=>x.id===b.dataset.toggleCandidate);r.selected=!r.selected;saveFree();renderFree()});
document.querySelectorAll('[data-cand-freq]').forEach(b=>b.onclick=()=>{const r=freeState.rows.find(x=>x.id===b.dataset.candFreq);r.freq=Number(b.dataset.val);saveFree();renderFree()});
document.querySelectorAll('[data-cand-risk]').forEach(b=>b.onclick=()=>{const r=freeState.rows.find(x=>x.id===b.dataset.candRisk);r.risk=Number(b.dataset.val);saveFree();renderFree()});
document.querySelectorAll('[data-deep-area-count]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.deepAreaCount);deepState.areas=Array.from({length:n},()=>({id:uid('a'),name:'',activity:0,collab:0,imported:false,tasks:[]}));saveDeep();renderDeep()});
const an=$('#deepAreaName');if(an)an.oninput=()=>{deepState.areas[deepState.areaIndex].name=an.value.trim();saveDeep();const a=deepState.areas[deepState.areaIndex],n=$('[data-next]');if(n)n.disabled=!(a.name&&a.activity&&a.collab)};
const ad=$('[data-add-deep-task]');if(ad)ad.onclick=addDeepTask;const ti=$('#deepTaskInput');if(ti)ti.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addDeepTask()}};
document.querySelectorAll('[data-remove-deep-task]').forEach(b=>b.onclick=()=>{deepState.areas[deepState.taskAreaIndex].tasks.splice(Number(b.dataset.removeDeepTask),1);saveDeep();renderDeep()});
const nx=$('[data-next]');if(nx)nx.onclick=()=>mode==='free'?nextFree():nextDeep();const bk=$('[data-back]');if(bk)bk.onclick=()=>mode==='free'?backFree():backDeep();const home=$('[data-home]');if(home)home.onclick=()=>location.hash='';const cpf=$('[data-copy-free]');if(cpf)cpf.onclick=()=>{navigator.clipboard?.writeText(freeSummaryText());cpf.textContent='복사됨 ✓'};const csv=$('[data-export-csv]');if(csv)csv.onclick=exportFreeCsv;const cp=$('[data-copy-summary]');if(cp)cp.onclick=()=>{navigator.clipboard?.writeText($('.copybox')?.innerText||'');cp.textContent='복사됨 ✓'};}
function route(){const h=location.hash.replace('#','');if(h==='free'){mode='free';restoreFree();renderFree()}else if(h==='deep-from-free'){mode='deep';restoreDeep();if(deepState.source!=='free'||!deepState.areas.length)prepareDeepFromFree();renderDeep()}else if(h==='deep'){mode='deep';restoreDeep();if(deepState.source==='free')deepState=freshDeep();renderDeep()}else{mode='home';renderHome()}}
window.addEventListener('hashchange',route);route();
</script>
</body></html>
