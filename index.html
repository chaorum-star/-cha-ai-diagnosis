<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>차팀장 AI 직원 진단</title><style>

:root{
  --bg:#F6F2EC; --paper:#FFFDF9; --ink:#191816; --muted:#726E68;
  --line:#E6DED4; --orange:#F47345; --orange-soft:#FFF0E8;
  --purple:#6B55E8; --purple-soft:#F0EDFF; --green:#2B7A55;
  --shadow:0 18px 55px rgba(35,28,22,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
a{color:inherit}
.app{min-height:100vh}
.top{
  position:sticky; top:0; z-index:20; background:rgba(246,242,236,.92);
  backdrop-filter:blur(14px); border-bottom:1px solid rgba(0,0,0,.035)
}
.topin{max-width:760px;margin:auto;padding:14px 18px}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:10px;background:#191816;color:#fff;display:grid;place-items:center;font-weight:900}
.brand{font-size:14px;font-weight:900}
.progress{height:7px;background:#E6DED4;border-radius:99px;overflow:hidden;margin-top:12px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#FFAA7F);transition:.25s}
.wrap{max-width:760px;margin:auto;padding:24px 16px 56px}
.card{background:var(--paper);border:1px solid rgba(0,0,0,.045);border-radius:26px;padding:28px 22px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.04em;color:var(--orange);margin-bottom:12px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(36px,9.5vw,58px);line-height:1.06;letter-spacing:-.06em;margin-bottom:18px}
h2{font-size:clamp(29px,7.5vw,42px);line-height:1.15;letter-spacing:-.05em;margin-bottom:14px}
h3{font-size:20px;letter-spacing:-.035em}
.lead{font-size:17px;line-height:1.68;color:#4E4A45}
.sub{font-size:14px;line-height:1.6;color:var(--muted)}
.field{margin:22px 0}
.field input,.field textarea{
  width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;
  padding:17px 16px;outline:0;font-size:16px
}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(107,85,232,.09)}
.choices{display:grid;gap:11px;margin-top:20px}
.choice{
  width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--ink);
  border-radius:17px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px
}
.choice.selected{border-color:var(--purple);background:var(--purple-soft)}
.choice b{font-size:16px}
.choice small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid #CFC6BC;display:grid;place-items:center;flex:none}
.choice.selected .dot{background:var(--purple);border-color:var(--purple);color:#fff}
.actions{display:flex;gap:10px;margin-top:28px}
.btn{border:0;border-radius:14px;padding:15px 17px;font-weight:900;min-height:50px}
.btn.main{background:#191816;color:#fff;flex:1}
.btn.orange{background:var(--orange);color:#fff;flex:1}
.btn.soft{background:#EFE9E2;color:#3F3A35}
.btn:disabled{opacity:.35}
.note{background:var(--orange-soft);border-radius:16px;padding:15px 16px;font-size:13px;line-height:1.55;color:#754936;margin-top:18px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.pill{background:#F0EAE4;border-radius:99px;padding:8px 10px;font-size:12px;font-weight:800}
.resultHero{background:linear-gradient(135deg,#191816,#2C2545);color:#fff;border-radius:24px;padding:25px;margin-bottom:15px}
.resultHero .eyebrow{color:#FFB498}
.resultHero p{color:#DAD6E2;line-height:1.6;margin:0}
.score{font-size:52px;font-weight:950;letter-spacing:-.06em}
.resultCard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:12px}
.bar{height:8px;background:#EEE8E1;border-radius:99px;overflow:hidden;margin:13px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),#9D8BFF)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini{background:#F7F3EF;border-radius:14px;padding:12px}
.mini b{display:block;font-size:12px;margin-bottom:4px}
.mini span{font-size:12px;color:var(--muted)}
.cta{background:var(--purple-soft);border:1px solid #DDD5FF;border-radius:20px;padding:20px;margin-top:18px}
.cta h3{margin-bottom:8px}
.cta p{color:#5F5879;line-height:1.55;margin:0}
.rank{display:flex;gap:12px;align-items:flex-start}
.num{width:34px;height:34px;border-radius:11px;background:#191816;color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.rankmain{flex:1}
.rankmain h3{margin:0 0 5px}
.rankmain p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.copybox{white-space:pre-wrap;background:#191816;color:#F5F1EA;border-radius:17px;padding:16px;font-size:12px;line-height:1.55;max-height:260px;overflow:auto}
.footer{font-size:11px;color:#8A857F;text-align:center;line-height:1.5;padding-top:14px}
@media(max-width:520px){
  .wrap{padding-left:12px;padding-right:12px}
  .card{padding:24px 17px;border-radius:22px}
  .grid2{grid-template-columns:1fr}
}

.hero{padding:40px 4px 20px}
.modecards{display:grid;gap:14px;margin-top:24px}
.modecard{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.modecard.dark{background:linear-gradient(135deg,#191816,#2C2545);color:#fff;border:0}
.modecard .tag{display:inline-block;border-radius:99px;padding:7px 10px;background:var(--purple-soft);color:var(--purple);font-size:11px;font-weight:900;margin-bottom:12px}
.modecard.dark .tag{background:rgba(255,255,255,.12);color:#FFB498}
.modecard h2{font-size:27px;margin-bottom:10px}
.modecard p{color:var(--muted);line-height:1.55;margin:0}
.modecard.dark p{color:#D8D4E0}
.go{font-weight:900;margin-top:18px}
.hidden{display:none!important}

.minstatus{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F7F3EF;border-radius:15px;padding:13px 14px;margin:14px 0}
.minstatus b{font-size:13px}.minstatus span{font-size:12px;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 11px;font-size:12px;font-weight:800;color:#4B4640}
.taskrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0}.taskpill{display:inline-flex;align-items:center;gap:7px;background:#F0EAE4;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800}.taskpill button{border:0;background:transparent;color:#8C847B;font-weight:900;padding:0 2px}
.explain{display:grid;gap:10px;margin-top:15px}.explainrow{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.explainrow b{display:block;font-size:13px;margin-bottom:5px}.explainrow p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.sectiontitle{margin:24px 0 10px;font-size:18px;font-weight:950;letter-spacing:-.035em}.good{color:var(--green)}.warn{color:#A86615}.bad{color:#A5483F}
.boundary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.boundary>div{border-radius:16px;padding:14px}.boundary .ai{background:var(--purple-soft)}.boundary .human{background:var(--orange-soft)}.boundary b{display:block;font-size:12px;margin-bottom:6px}.boundary p{margin:0;font-size:12px;line-height:1.5;color:#5F5879}.boundary .human p{color:#754936}
.steps{counter-reset:step;display:grid;gap:9px;margin-top:12px}.stepitem{position:relative;padding:13px 13px 13px 46px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:13px;line-height:1.5}.stepitem:before{counter-increment:step;content:counter(step);position:absolute;left:13px;top:12px;width:24px;height:24px;border-radius:8px;background:#191816;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}
@media(max-width:520px){.boundary{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><header class="top"><div class="topin"><div class="brandrow"><span class="logo">차</span><span class="brand" id="brandTitle">차팀장랩</span></div><div class="progress"><i id="bar"></i></div></div></header><main class="wrap"><section class="card" id="screen"></section><div class="footer">차팀장랩 · AI는 초안과 정리를 맡고, 중요한 판단과 최종 승인은 사람이 합니다.</div></main></div>
<script>
const $=s=>document.querySelector(s);
const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let mode='home';
let freeState={step:0,job:'',task:'',freq:0,time:0,rules:0,data:0,approval:0};
const freshClassState=()=>({step:0,industry:'',team:'',customer:'',tasks:[],ti:0,qi:0,source:'direct'});
let classState=freshClassState();
const classQs=[
 {k:'freq',t:'이 일은 얼마나 자주 하나요?',a:[['거의 매일',5],['주 2~4회',4],['주 1회',3],['월 2~3회',2],['가끔',1]]},
 {k:'time',t:'한 번 할 때 얼마나 걸리나요?',a:[['10분 이하',1],['10~30분',2],['30~60분',3],['1~2시간',4],['2시간 이상',5]]},
 {k:'rules',t:'매번 비슷한 기준으로 처리하나요?',a:[['거의 같은 기준',5],['대체로 비슷함',4],['절반 정도 비슷함',3],['상황마다 많이 다름',2],['매번 완전히 다름',1]]},
 {k:'data',t:'필요한 자료는 얼마나 정리돼 있나요?',a:[['한곳에 잘 정리됨',5],['몇 군데로 나뉨',4],['메신저·문서 등에 흩어짐',3],['대부분 머릿속에 있음',2],['자료가 거의 없음',1]]},
 {k:'approval',t:'AI가 초안을 만들고 내가 확인하는 방식이 괜찮나요?',a:[['그 방식이면 충분함',5],['대부분 가능',4],['반반',3],['사람 판단이 훨씬 많음',2],['맡기기 어려움',1]]}
];
const quickTasks=['고객 문의 답변','예약/일정 확인','상담 후속관리','콘텐츠 기획·작성','메일 분류·답장','자료/파일 정리'];
function roleFor(t){let n=t.toLowerCase();if(/상담|문의|고객|cs|답변/.test(n))return '고객관리 AI 직원';if(/콘텐츠|인스타|블로그|릴스|유튜브|게시/.test(n))return '콘텐츠 AI 직원';if(/예약|일정/.test(n))return '예약관리 AI 직원';if(/메일|이메일/.test(n))return '메일비서 AI 직원';if(/정산|매출|비용|결제/.test(n))return '운영정리 AI 직원';return '업무보조 AI 직원'}
function flowFor(t){let n=t.toLowerCase();if(/상담|문의|고객|cs|답변/.test(n))return '원문 수집 → 분류 → 우선순위 → 답변 초안 → 사람 확인';if(/콘텐츠|인스타|블로그|릴스|유튜브|게시/.test(n))return '자료/레퍼런스 → 주제 → 기획 → 초안 → 검수';if(/예약|일정/.test(n))return '예약정보 → 조건 확인 → 대상 분류 → 안내 초안 → 기록';if(/메일|이메일/.test(n))return '메일 → 중요도 분류 → 답장 필요 판단 → 초안 → 확인';return '입력자료 → 기준 판단 → 결과 초안 → 사람 확인 → 저장'}
function setScreen(html,pct=0,title='차팀장랩'){$('#screen').innerHTML=html;$('#bar').style.width=pct+'%';$('#brandTitle').textContent=title;window.scrollTo({top:0,behavior:'instant'})}
function choiceHtml(items,key,current,scope){return '<div class="choices">'+items.map(x=>`<button class="choice ${String(current)==String(x[1])?'selected':''}" data-choice data-scope="${scope}" data-key="${key}" data-val="${x[1]}"><div><b>${x[0]}</b></div><span class="dot">${String(current)==String(x[1])?'✓':''}</span></button>`).join('')+'</div>'}
function navHtml(label='다음',disabled=false){return `<div class="actions"><button class="btn soft" data-back>이전</button><button class="btn main" data-next ${disabled?'disabled':''}>${label}</button></div>`}
function canImportFree(){return !!(freeState.job&&freeState.task&&freeState.freq&&freeState.time&&freeState.rules&&freeState.data&&freeState.approval)}
function prepareClassFromFree(){
 if(!canImportFree())return false;
 classState={
   step:2, industry:freeState.job, team:'', customer:'', ti:0, qi:0, source:'free',
   tasks:[{name:freeState.task,imported:true,s:{freq:freeState.freq,time:freeState.time,rules:freeState.rules,data:freeState.data,approval:freeState.approval}}]
 };
 return true;
}
function isTaskComplete(t){return classQs.every(q=>Number(t?.s?.[q.k])>0)}
function firstMissingQi(t){const i=classQs.findIndex(q=>!Number(t?.s?.[q.k]));return i<0?0:i}
function nextIncompleteTask(after=-1){for(let i=after+1;i<classState.tasks.length;i++)if(!isTaskComplete(classState.tasks[i]))return i;return -1}
function previousEditableTask(before){for(let i=before-1;i>=0;i--)if(!classState.tasks[i].imported)return i;return -1}
function bindGlobal(){
 document.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{const scope=btn.dataset.scope,key=btn.dataset.key,raw=btn.dataset.val,val=!isNaN(Number(raw))&&raw.trim()!==''?Number(raw):raw;if(scope==='free')freeState[key]=val;else if(scope==='class-profile')classState[key]=raw;else classState.tasks[classState.ti].s[key]=val;render()});
 const b=$('[data-back]');if(b)b.onclick=goBack;const n=$('[data-next]');if(n)n.onclick=goNext;
 const st=$('[data-start]');if(st)st.onclick=()=>{if(mode==='free')freeState.step=1;else classState.step=1;render()};
 const add=$('[data-add]');if(add)add.onclick=()=>addTask();
 document.querySelectorAll('[data-quick]').forEach(q=>q.onclick=()=>addTask(q.dataset.quick));
 document.querySelectorAll('[data-remove]').forEach(r=>r.onclick=()=>{classState.tasks.splice(Number(r.dataset.remove),1);render()});
 const copy=$('[data-copy]');if(copy)copy.onclick=copyClassSummary;const homeBtn=$('[data-home]');if(homeBtn)homeBtn.onclick=()=>location.hash='';
 [['#job',v=>freeState.job=v],['#task',v=>freeState.task=v],['#industry',v=>classState.industry=v],['#customer',v=>classState.customer=v]].forEach(([sel,setter])=>{const input=$(sel);if(!input)return;const sync=()=>{const value=input.value.trim();setter(value);const next=$('[data-next]');if(next)next.disabled=!value};input.addEventListener('input',sync);input.addEventListener('change',sync)});
 const ti=$('#taskin');if(ti)ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTask()}})
}
function home(){setScreen(`<div class="eyebrow">AI EMPLOYEE DIAGNOSIS</div><h1>AI부터 배우기 전에,<br>내가 넘길 일부터.</h1><p class="lead">반복업무를 기준으로 지금 어떤 일을 AI에게 먼저 맡기면 좋은지 진단합니다.</p><div class="modecards"><a class="modecard dark" href="#free"><span class="tag">무료 · 약 4분</span><h2>내 업무 하나<br>AI 적합도 진단</h2><p>왜 적합한지, 어디서 막히는지, AI에게 어디까지 맡길지 확인합니다.</p><div class="go">무료 진단 시작 →</div></a><a class="modecard" href="#class"><span class="tag">수강 전 · 약 6~10분</span><h2>내 업무 시스템<br>심층 진단</h2><p>반복업무 여러 개를 비교해 우선순위 TOP3와 실제 구축 순서를 정합니다.</p><div class="go">심층 진단 시작 →</div></a></div>`,0)}
function renderFree(){const s=freeState.step;
 if(s===0)return setScreen(`<div class="eyebrow">무료 · 약 4분</div><h1>이 일을 AI에게<br>맡겨도 될까?</h1><p class="lead">단순히 “자동화 가능/불가”를 말하지 않습니다. <b>반복성·시간·판단기준·자료·사람 검수</b>를 보고 왜 적합한지까지 설명합니다.</p><div class="note">결과에서 <b>AI가 맡을 구간 / 사람이 남아야 할 구간 / 먼저 정리할 것</b>까지 보여드립니다.</div><div class="actions"><button class="btn orange" data-start>무료 진단 시작 →</button></div>`,2,'무료 AI 직원 진단');
 if(s===1)return setScreen(`<div class="eyebrow">1 / 7 · 기본정보</div><h2>어떤 일을 하고 계세요?</h2><p class="sub">업종이나 역할을 짧게 적어주세요.</p><div class="field"><input id="job" value="${esc(freeState.job)}" placeholder="예: 크리에이터, 필라테스 센터, 온라인 쇼핑몰"></div>${navHtml('다음',!freeState.job)}`,14,'무료 AI 직원 진단');
 if(s===2)return setScreen(`<div class="eyebrow">2 / 7 · 진단할 업무</div><h2>최근 가장 자주<br>반복한 일 하나는?</h2><p class="sub">“고객관리”보다 “상담 후 미등록 고객 후속 연락”처럼 구체적일수록 결과가 정확합니다.</p><div class="field"><input id="task" value="${esc(freeState.task)}" placeholder="예: 타사 벤치마킹 분석"></div>${navHtml('다음',!freeState.task)}`,27,'무료 AI 직원 진단');
 if(s===3)return setScreen(`<div class="eyebrow">3 / 7 · 반복성</div><h2>이 일은 얼마나 자주 하나요?</h2><p class="sub">반복될수록 한 번 잘 설계했을 때 효과가 누적됩니다.</p>${choiceHtml([['거의 매일',5],['주 2~4회',4],['주 1회',3],['월 2~3회',2],['가끔',1]],'freq',freeState.freq,'free')}${navHtml('다음',!freeState.freq)}`,40,'무료 AI 직원 진단');
 if(s===4)return setScreen(`<div class="eyebrow">4 / 7 · 시간</div><h2>한 번 할 때 얼마나 걸리나요?</h2><p class="sub">오래 걸리는 일일수록 AI가 초안과 정리를 맡았을 때 체감이 큽니다.</p>${choiceHtml([['10분 이하',1],['10~30분',2],['30~60분',3],['1~2시간',4],['2시간 이상',5]],'time',freeState.time,'free')}${navHtml('다음',!freeState.time)}`,53,'무료 AI 직원 진단');

 if(s===6)return setScreen(`<div class="eyebrow">6 / 7 · 입력자료</div><h2>필요한 자료는<br>어디에 있나요?</h2><p class="sub">AI가 일을 하려면 먼저 “무엇을 보고 일할지”가 있어야 합니다.</p>${choiceHtml([['한곳에 잘 정리돼 있음',5],['몇 군데로 나뉘어 있음',4],['메신저·문서 등에 흩어져 있음',3],['대부분 내 머릿속에 있음',2],['자료가 거의 없음',1]],'data',freeState.data,'free')}${navHtml('다음',!freeState.data)}`,79,'무료 AI 직원 진단');

}
function renderFreeResult(){const f=freeState,score=Math.round((f.freq*20+f.time*15+f.rules*25+f.data*20+f.approval*20)/5),grade=score>=80?'바로 설계해볼 만한 업무':score>=65?'조건을 정리하면 좋은 업무':'보조 구간부터 맡길 업무';const items=[['반복성',f.freq,f.freq>=4?'자주 반복돼 설계 효과가 누적됩니다.':f.freq>=3?'반복은 있지만 우선순위는 다른 업무와 비교해보는 게 좋습니다.':'빈도가 낮아 자동화보다 템플릿화가 먼저일 수 있습니다.'],['판단기준',f.rules,f.rules>=4?'처리 기준이 반복돼 AI가 따라 배우기 좋습니다.':f.rules>=3?'기준 일부를 말로 꺼내면 맡길 수 있는 범위가 넓어집니다.':'상황별 판단이 많아 먼저 “나는 무엇을 보고 결정하는가”를 정리해야 합니다.'],['입력자료',f.data,f.data>=4?'AI가 참고할 자료가 비교적 준비돼 있습니다.':f.data>=3?'자료가 흩어져 있어 한곳에 모으는 것만으로도 효과가 큽니다.':'자료가 머릿속에 있어 AI보다 먼저 입력 자산을 만드는 일이 필요합니다.'],['사람 검수',f.approval,f.approval>=4?'AI 초안 + 사람 승인 구조가 잘 맞습니다.':f.approval>=3?'일부는 맡기고 중요한 판단만 남기는 구조가 적합합니다.':'최종 판단 비중이 높아 완전 자동화가 아니라 보조 역할부터 시작해야 합니다.']];const weakest=[...items].sort((a,b)=>a[1]-b[1])[0],explain=items.map(x=>`<div class="explainrow"><b class="${x[1]>=4?'good':x[1]<=2?'bad':'warn'}">${x[0]} · ${x[1]}/5</b><p>${x[2]}</p></div>`).join('');setScreen(`<div class="resultHero"><div class="eyebrow">무료 진단 결과</div><h2>${grade}</h2><div class="score">${score}점</div><p><b>${esc(f.task)}</b>을 AI에게 맡길 때의 준비도를 분석했습니다.</p></div><div class="sectiontitle">왜 이런 결과가 나왔나요?</div><div class="explain">${explain}</div><div class="sectiontitle">이 업무에서 가장 먼저 손볼 것</div><div class="note"><b>${weakest[0]}</b><br>${weakest[2]}</div><div class="sectiontitle">AI에게 어디까지 맡길까요?</div><div class="resultCard"><div class="rank"><div class="num">AI</div><div class="rankmain"><h3>${roleFor(f.task)}</h3><p>${flowFor(f.task)}</p></div></div><div class="boundary"><div class="ai"><b>AI 담당</b><p>자료 정리 · 기준에 따른 분류 · 초안 생성 · 누락 체크</p></div><div class="human"><b>사람 담당</b><p>예외 판단 · 관계가 걸린 결정 · 사실 확인 · 최종 승인</p></div></div></div><div class="sectiontitle">처음 만들 때는 이 순서입니다</div><div class="steps"><div class="stepitem"><b>범위</b> — 어디서 시작해서 어디까지 끝낼지</div><div class="stepitem"><b>입력</b> — AI가 보고 일할 실제 자료</div><div class="stepitem"><b>판단기준</b> — 내가 무엇을 보고 결정하는지</div><div class="stepitem"><b>결과물</b> — AI가 만들어야 할 완성 형태</div><div class="stepitem"><b>사람 확인</b> — AI가 멈추고 내가 승인할 지점</div></div><div class="cta"><h3>이제 “이 업무가 정말 1순위인지” 비교해볼 수 있어요.</h3><p><b>방금 입력한 업종·업무·5개 진단값은 그대로 가져갑니다.</b> 심층진단에서는 같은 질문을 다시 하지 않고, 다른 반복업무만 추가해 비교합니다.</p><div class="actions"><a class="btn orange" href="#class-from-free" style="text-decoration:none;text-align:center">다른 업무와 비교 진단 →</a></div></div><div class="actions"><button class="btn soft" data-home>처음으로</button></div>`,100,'무료 AI 직원 진단')}
function importedNote(){if(classState.source!=='free')return '';const t=classState.tasks.find(x=>x.imported);return `<div class="note"><b>무료진단에서 이어서 진행 중</b><br>${esc(classState.industry)} · ${esc(t?.name||'')}<br><span style="opacity:.8">이미 답한 업종과 이 업무의 진단 질문은 다시 묻지 않습니다.</span></div>`}
function renderClass(){const s=classState.step,fromFree=classState.source==='free';
 if(s===0)return setScreen(`<div class="eyebrow">수강 전 · 약 6~10분</div><h1>내 사업에 필요한<br>AI 직원 TOP3</h1><p class="lead">업무 하나의 가능성이 아니라 <b>내 반복업무끼리 비교</b>해서 어디부터 맡겨야 효과가 큰지 정합니다.</p><div class="note">최소 3개의 실제 업무를 넣어야 우선순위를 비교할 수 있습니다.</div><div class="actions"><button class="btn orange" data-start>심층진단 시작 →</button></div>`,2,'수강 전 심층진단');
 if(s===1)return setScreen(`<div class="eyebrow">기본정보 1 / 3</div><h2>어떤 일을 하고 계세요?</h2><div class="field"><input id="industry" value="${esc(classState.industry)}" placeholder="예: 크리에이터, 필라테스 센터, 온라인 쇼핑몰"></div>${navHtml('다음',!classState.industry)}`,8,'수강 전 심층진단');
 if(s===2)return setScreen(`${importedNote()}<div class="eyebrow">${fromFree?'새 정보 1 / 2':'기본정보 2 / 3'}</div><h2>몇 명이 함께 일하나요?</h2>${choiceHtml([['혼자 운영','혼자 운영'],['2~5명','2~5명'],['6명 이상','6명 이상']],'team',classState.team,'class-profile')}${navHtml('다음',!classState.team)}`,fromFree?10:14,'수강 전 심층진단');
 if(s===3)return setScreen(`${fromFree?importedNote():''}<div class="eyebrow">${fromFree?'새 정보 2 / 2':'기본정보 3 / 3'}</div><h2>주로 누구를 상대하나요?</h2><div class="field"><input id="customer" value="${esc(classState.customer)}" placeholder="예: 브랜드 담당자, 30~50대 여성 회원"></div>${navHtml()}`,fromFree?18:20,'수강 전 심층진단');
 if(s===4){const n=classState.tasks.length,remaining=Math.max(0,3-n),imported=classState.tasks.filter(t=>t.imported).length,status=n>=3?`비교 준비 완료 · ${n}개 업무`:(fromFree?`무료진단 ${imported}개 불러옴 · ${remaining}개 더 필요`:`최소 3개 중 ${n}개 입력 · ${remaining}개 더 필요`),btn=n>=3?`이 ${n}개 업무 비교 진단하기 →`:`${remaining}개 더 입력해주세요`,taskrows=classState.tasks.map((t,i)=>`<span class="taskpill">${i+1}. ${esc(t.name)}${t.imported?' · 무료진단':''} <button data-remove="${i}" aria-label="삭제">×</button></span>`).join(''),quick=quickTasks.filter(q=>!classState.tasks.some(t=>t.name===q)).map(q=>`<button data-quick="${q}">+ ${q}</button>`).join('');return setScreen(`${fromFree?importedNote():''}<div class="eyebrow">반복업무 비교</div><h2>${fromFree?'다른 반복업무를<br>2개 이상 더 적어주세요.':'지난 일주일에<br>2번 이상 한 일을 적어주세요.'}</h2><p class="sub">${fromFree?'무료진단에서 본 업무는 이미 1개로 등록했고, 같은 진단값도 가져왔습니다. 이제 <b>다른 업무만</b> 추가하면 됩니다.':'여기서는 업무 하나를 진단하는 게 아니라 <b>서로 비교</b>합니다. 그래서 최소 3개가 필요합니다.'}</p><div class="minstatus"><b>${status}</b><span>최대 8개</span></div><div class="field"><input id="taskin" placeholder="예: 타사 벤치마킹 분석"></div><div class="actions" style="margin-top:10px"><button class="btn soft" data-add>+ 직접 입력한 업무 추가</button></div><div class="sub" style="margin-top:18px"><b>잘 안 떠오르면 최근에 한 일에서 골라도 됩니다.</b></div><div class="quick">${quick}</div><div class="taskrow">${taskrows}</div>${navHtml(btn,n<3)}`,27,'수강 전 심층진단')}
 if(s===5){const t=classState.tasks[classState.ti],q=classQs[classState.qi],newTasks=classState.tasks.filter(x=>!x.imported).length,answeredBefore=classState.tasks.slice(0,classState.ti).filter(x=>!x.imported).length*5+classState.qi,totalNew=Math.max(1,newTasks*5),p=30+Math.round(answeredBefore/totalNew*58);return setScreen(`<div class="eyebrow">새 업무 진단 · ${classState.ti+1} / ${classState.tasks.length}</div><div class="pills"><span class="pill">${esc(t.name)}</span></div><h2>${q.t}</h2><p class="sub">무료진단에서 이미 답한 업무는 건너뛰고, 새로 추가한 업무만 묻고 있습니다.</p>${choiceHtml(q.a,q.k,t.s[q.k],'class-task')}${navHtml(nextIncompleteTask(classState.ti)===-1&&classState.qi===4?'결과 보기':'다음',!t.s[q.k])}`,p,'수강 전 심층진단')}
 const r=calcClass(),top=r.slice(0,3),cards=top.map((t,i)=>`<div class="resultCard"><div class="rank"><div class="num">${i+1}</div><div class="rankmain"><h3>${roleFor(t.name)}</h3><p><b>${esc(t.name)}</b>${t.imported?' · 무료진단':''}<br>${flowFor(t.name)}</p></div><div style="font-size:25px;font-weight:950;color:var(--purple)">${t.score}</div></div><div class="bar"><i style="width:${t.score}%"></i></div><div class="grid2"><div class="mini"><b>AI 준비도</b><span>${t.ready}%</span></div><div class="mini"><b>시간절감 잠재력</b><span>${t.potential}%</span></div></div></div>`).join('');return setScreen(`<div class="resultHero"><div class="eyebrow">AI 직원 배치안</div><h2>${esc(classState.industry)}에서<br>먼저 구축할 TOP3</h2><p>입력한 ${classState.tasks.length}개 업무를 같은 기준으로 비교했습니다.</p></div>${cards}<div class="cta"><h3>집중반에서는 1순위부터 실제로 검증합니다.</h3><p>실제 데이터로 구축 → 다른 데이터로 재실행 → 실패 원인 수정 → 2·3순위 업무에 같은 원리를 옮깁니다.</p></div><div style="margin-top:20px"><h3>차팀장에게 보내는 진단 요약</h3><div class="copybox">${esc(classSummary())}</div><div class="actions"><button class="btn orange" data-copy>진단결과 복사</button></div></div><div class="actions"><button class="btn soft" data-home>처음으로</button></div>`,100,'수강 전 심층진단')
}
function calcClass(){classState.tasks.forEach(t=>{const s=t.s;t.score=Math.round((s.freq*25+s.time*20+s.rules*25+s.data*15+s.approval*15)/5);t.ready=Math.round((s.rules+s.data+s.approval)/15*100);t.potential=Math.round((s.freq+s.time)/10*100)});return [...classState.tasks].sort((a,b)=>b.score-a.score)}
function classSummary(){const r=calcClass().slice(0,3);return `[차팀장 AI 업무 시스템 심층진단]

업종/업무: ${classState.industry}
팀 규모: ${classState.team}
주요 고객: ${classState.customer||'-'}

AI 직원 TOP3
1. ${r[0]?.name||'-'} / ${r[0]?.score||'-'}점
2. ${r[1]?.name||'-'} / ${r[1]?.score||'-'}점
3. ${r[2]?.name||'-'} / ${r[2]?.score||'-'}점

집중반에서 우선 확인할 것
- 필요한 입력자료
- 내가 직접 판단하는 기준
- 사람이 승인할 지점
- 결과 저장 위치와 다음 행동`}
function addTask(forced){const el=$('#taskin'),v=(forced||(el?el.value:'')).trim();if(!v||classState.tasks.length>=8||classState.tasks.some(t=>t.name===v))return;classState.tasks.push({name:v,imported:false,s:{}});render()}
function goNext(){
 if(mode==='free'){if(freeState.step===1){const v=$('#job').value.trim();if(!v)return;freeState.job=v}if(freeState.step===2){const v=$('#task').value.trim();if(!v)return;freeState.task=v}freeState.step++;return render()}
 if(classState.step===1){const v=$('#industry').value.trim();if(!v)return;classState.industry=v;classState.step=2}
 else if(classState.step===2){if(!classState.team)return;classState.step=3}
 else if(classState.step===3){classState.customer=$('#customer').value.trim();classState.step=4}
 else if(classState.step===4){if(classState.tasks.length<3)return;const idx=nextIncompleteTask(-1);if(idx===-1)classState.step=6;else{classState.step=5;classState.ti=idx;classState.qi=firstMissingQi(classState.tasks[idx])}}
 else if(classState.step===5){const t=classState.tasks[classState.ti],q=classQs[classState.qi];if(!t.s[q.k])return;const nextQi=classState.qi+1;if(nextQi<classQs.length&&!t.s[classQs[nextQi].k])classState.qi=nextQi;else{const idx=nextIncompleteTask(classState.ti);if(idx===-1)classState.step=6;else{classState.ti=idx;classState.qi=firstMissingQi(classState.tasks[idx])}}}
 render()
}
function goBack(){
 if(mode==='free'){if(freeState.step<=0)location.hash='';else freeState.step--;return render()}
 if(classState.step===1)classState.step=0;
 else if(classState.step===2){if(classState.source==='free')location.hash='#free';else classState.step=1}
 else if(classState.step===3)classState.step=2;
 else if(classState.step===4)classState.step=3;
 else if(classState.step===5){if(classState.qi>0)classState.qi--;else{const prev=previousEditableTask(classState.ti);if(prev>=0){classState.ti=prev;classState.qi=4}else classState.step=4}}
 else if(classState.step===6){const last=[...classState.tasks].map((t,i)=>({t,i})).filter(x=>!x.t.imported).pop();if(last){classState.step=5;classState.ti=last.i;classState.qi=4}else classState.step=4}
 render()
}
async function copyClassSummary(){try{await navigator.clipboard.writeText(classSummary());alert('진단 결과를 복사했습니다.')}catch(e){alert('복사가 제한된 브라우저입니다. 아래 요약을 길게 눌러 복사해주세요.')}}
function route(){const h=location.hash.replace('#','');if(h==='free'){mode='free'}else if(h==='class-from-free'){mode='class';if(!prepareClassFromFree()){classState=freshClassState();mode='class'}}else if(h==='class'){mode='class';if(classState.source==='free')classState=freshClassState()}else mode='home';render()}
function render(){if(mode==='home')home();else if(mode==='free')renderFree();else renderClass();bindGlobal()}
window.addEventListener('hashchange',route);route();
</script>
