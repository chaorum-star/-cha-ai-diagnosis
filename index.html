<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="내 반복업무를 비교해 가장 먼저 만들 AI 직원과 구축 순서를 찾는 차팀장 AI 직원진단">
<title>차팀장 AI 직원진단</title>
<style>
html,body{margin:0;min-height:100%;background:#FBF8F5;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;color:#211A25}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}#boot b{display:block;font-size:18px;margin-bottom:8px}#boot span{font-size:13px;color:#766D77}
</style>
</head>
<body>
<div id="boot"><div><b>차팀장 AI 직원진단</b><span>진단을 불러오고 있어요…</span></div></div>
<script>
(async()=>{
try{
const parts=['01','02','03','04','05'];
const texts=await Promise.all(parts.map(n=>fetch(`./payload/part-${n}.txt`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload '+n);return r.text()})));
const b64=texts.join('').replace(/\s/g,'');
const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const html=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').innerHTML='<div><b>페이지를 불러오지 못했어요.</b><span>Safari에서 새로고침해 주세요.</span></div>';console.error(e)}
})();
</script>
</body>
</html>
