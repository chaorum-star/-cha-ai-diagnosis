<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="매주 반복되는 업무에서 먼저 줄여볼 일을 근거와 함께 찾는 차팀장 무료 진단">
  <meta name="app-version" content="9.0.0">
  <title>차팀장 · 내 업무에서 먼저 줄일 일 찾기</title>
  <style>
    @font-face{font-family:Paperlogy;src:url('./assets/fonts/Paperlogy-6SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
    @font-face{font-family:Paperlogy;src:url('./assets/fonts/Paperlogy-7Bold.ttf') format('truetype');font-weight:700;font-display:swap}
    @font-face{font-family:Paperlogy;src:url('./assets/fonts/Paperlogy-8ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap}
    @font-face{font-family:Pretendard;src:url('./assets/fonts/Pretendard-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
    @font-face{font-family:Pretendard;src:url('./assets/fonts/Pretendard-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
    @font-face{font-family:Pretendard;src:url('./assets/fonts/Pretendard-ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}

    :root{
      --cream:#f5f1e8;
      --paper:#fffdf9;
      --white:#fff;
      --ink:#17191f;
      --muted:#625f5a;
      --line:#e8e1d8;
      --coral:#ff5a45;
      --coral-dark:#c93d2d;
      --coral-soft:#ffece9;
      --warm:#eee7de;
      --kakao:#fee500;
      --shadow:0 8px 0 rgba(23,25,31,.13);
      --soft-shadow:0 18px 52px rgba(48,37,26,.09);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:Paperlogy,"Apple SD Gothic Neo",sans-serif;font-weight:600}
    button,input,textarea,select{font:inherit}
    button,a{touch-action:manipulation}
    button{color:inherit}
    a{color:inherit}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(245,241,232,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(23,25,31,.07)}
    .topbar-inner{max-width:860px;margin:auto;padding:12px 18px 11px}
    .brandline{display:flex;align-items:center;gap:10px}
    .brandmark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 0 rgba(255,90,69,.55)}
    .brandname{font-size:15px;font-weight:800}
    .version{margin-left:auto;color:var(--muted);font:600 12px/1 Pretendard,sans-serif}
    .progress{height:7px;margin-top:11px;background:#e5ddd3;border-radius:99px;overflow:hidden}
    .progress>i{display:block;height:100%;width:0;background:var(--coral);transition:width .24s ease}
    .shell{max-width:860px;margin:auto;padding:28px 14px 72px}
    .screen{min-height:600px}
    .panel{background:var(--paper);border:1px solid rgba(23,25,31,.08);border-radius:22px;padding:28px 22px;box-shadow:var(--soft-shadow)}
    .hero{padding:10px 2px 28px}
    .eyebrow{margin-bottom:12px;color:var(--coral-dark);font-size:13px;font-weight:800;letter-spacing:.02em}
    h1,h2,h3,p{margin-top:0}
    h1{margin-bottom:20px;font-size:clamp(46px,9vw,66px);line-height:1.05;letter-spacing:-.055em;font-weight:800}
    h2{margin-bottom:16px;font-size:clamp(35px,7vw,46px);line-height:1.13;letter-spacing:-.045em;font-weight:800}
    h3{margin-bottom:10px;font-size:22px;line-height:1.32;letter-spacing:-.025em;font-weight:800}
    .lead{margin-bottom:0;color:#3f403f;font-size:18px;line-height:1.67;font-weight:600}
    .body{font-size:16px;line-height:1.68;color:#3f403f}
    .muted{color:var(--muted)}
    .micro{font-size:12px;line-height:1.55;color:var(--muted)}
    .highlight{background:linear-gradient(transparent 60%,#ffd9d3 60%);padding:0 2px}
    .promise{margin:25px 0 0;background:var(--ink);color:#fff;border-radius:18px;padding:22px;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--coral)}
    .promise-label{color:#ffb3a8;font-size:12px;font-weight:800;margin-bottom:8px}
    .promise strong{font-size:24px;line-height:1.42;letter-spacing:-.025em}
    .promise p{margin:10px 0 0;color:#dedbd5;font-size:15px;line-height:1.65}
    .future-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
    .future-item{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:16px 14px;min-height:118px}
    .future-item b{display:block;font-size:17px;line-height:1.35;margin-bottom:7px}
    .future-item span{display:block;font-size:13px;line-height:1.55;color:var(--muted)}
    .scene{margin:34px 0 0;padding:24px 20px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:rgba(255,255,255,.46)}
    .scene-time{font:800 36px/1 Pretendard,sans-serif;margin-bottom:12px}
    .scene p{margin:0;font-size:17px;line-height:1.72}
    .scene small{display:block;margin-top:12px;font-size:12px;color:var(--muted)}
    .privacy{display:flex;align-items:flex-start;gap:10px;margin:18px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
    .privacy b{color:var(--ink)}
    .actions{display:flex;gap:10px;margin-top:26px}
    .actions.stack{display:grid}
    .btn{min-height:56px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);border-radius:13px;padding:15px 18px;background:#fff;text-decoration:none;text-align:center;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
    .btn:hover{transform:translateY(1px);box-shadow:0 4px 0 var(--ink)}
    .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
    .btn.primary{flex:1;background:var(--coral);color:#fff}
    .btn.dark{flex:1;background:var(--ink);color:#fff}
    .btn.soft{background:#fff;color:var(--ink)}
    .btn.kakao{background:var(--kakao);color:#17191f}
    .btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
    .section-head{margin-bottom:24px}
    .question-why{margin:-2px 0 20px;padding:14px 16px;border-radius:13px;background:var(--coral-soft);color:#6f3027;font-size:14px;line-height:1.62}
    .field{margin:20px 0}
    .field label,.field-label{display:block;margin-bottom:8px;font-size:15px;font-weight:800}
    .field input,.field textarea,.field select{display:block;width:100%;border:1.5px solid #cdc5bb;border-radius:13px;background:#fff;color:var(--ink);padding:15px 14px;font-size:16px;line-height:1.55;outline:0}
    .field textarea{min-height:104px;resize:vertical}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--coral);box-shadow:0 0 0 4px rgba(255,90,69,.12)}
    ::placeholder{color:#99918a;opacity:1}
    .helper{display:block;margin-top:7px;color:var(--muted);font-size:12px;line-height:1.55}
    .example-bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
    .chipbtn{min-height:42px;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:9px 12px;font-size:13px;font-weight:800;cursor:pointer}
    .chipbtn.on{border-color:var(--coral);background:var(--coral-soft);color:#8e2f22}
    .task-list{display:grid;gap:13px}
    .task-row{background:#fff;border:1.5px solid var(--line);border-radius:17px;padding:16px}
    .task-row-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .task-num{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 13px/1 Pretendard,sans-serif;flex:none}
    .task-row-head b{font-size:16px}
    .remove{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 7px}
    .task-grid{display:grid;grid-template-columns:minmax(0,1fr) 105px 145px;gap:8px}
    .task-grid input,.task-grid select{width:100%;min-width:0;border:1.5px solid #d1c9c0;border-radius:11px;background:#fff;padding:13px 11px;font-size:15px;outline:0}
    .task-grid input:focus,.task-grid select:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,90,69,.1)}
    .candidate-list{display:grid;gap:12px}
    .candidate{width:100%;display:flex;gap:13px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:16px;cursor:pointer}
    .candidate.on{border:2px solid var(--coral);background:var(--coral-soft)}
    .check{width:27px;height:27px;border:1.5px solid #bcb4ab;border-radius:8px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:800}
    .candidate.on .check{background:var(--coral);border-color:var(--coral);color:#fff}
    .candidate b{display:block;font-size:17px;margin-bottom:5px}
    .candidate small{font-size:12px;line-height:1.55;color:var(--muted)}
    .context{margin-bottom:18px;padding:16px;border-radius:14px;background:var(--ink);color:#fff}
    .context small{display:block;color:#d5d1cb;font-size:12px;margin-bottom:5px}
    .context strong{font-size:20px;line-height:1.4}
    .diagnosis-group{margin:17px 0;padding:17px 0;border-top:1px solid var(--line)}
    .diagnosis-group:first-of-type{border-top:0}
    .diagnosis-group h3{font-size:18px;margin-bottom:6px}
    .diagnosis-group p{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:11px}
    .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .seg button{min-height:52px;border:1.5px solid #d2c9c0;border-radius:11px;background:#fff;padding:10px 7px;font-size:13px;line-height:1.32;font-weight:800;cursor:pointer}
    .seg button.on{border:2px solid var(--coral);background:var(--coral-soft);color:#7f2a20}
    .detail-flow{position:relative;margin-top:20px}
    .detail-flow:before{content:"";position:absolute;left:15px;top:18px;bottom:24px;width:3px;background:var(--coral)}
    .detail-step{position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;margin-bottom:16px}
    .detail-step-num{width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 12px/1 Pretendard,sans-serif;z-index:1}
    .detail-box{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:15px}
    .detail-box label{display:block;font-size:16px;font-weight:800;margin-bottom:5px}
    .detail-box p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 9px}
    .detail-box textarea{width:100%;min-height:90px;border:1.5px solid #d2c9c0;border-radius:11px;background:#fff;padding:13px;font-size:15px;line-height:1.55;resize:vertical;outline:0}
    .detail-box textarea:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,90,69,.1)}
    .result-hero{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:20px;padding:26px 22px;box-shadow:9px 9px 0 var(--coral);margin-bottom:34px}
    .result-hero .eyebrow{color:#ffb2a7}
    .result-hero h1{font-size:clamp(42px,8vw,58px);margin-bottom:14px}
    .result-hero p{margin:0;color:#dedbd6;font-size:17px;line-height:1.65}
    .decision{margin:22px 0 32px;padding:22px;background:#fff;border:2px solid var(--ink);border-radius:17px;box-shadow:7px 7px 0 var(--ink)}
    .decision-label{display:inline-block;margin-bottom:11px;border-radius:999px;background:var(--coral-soft);color:#7c2a20;padding:7px 10px;font-size:12px;font-weight:800}
    .decision h2{font-size:35px;margin-bottom:10px}
    .decision p{margin:0;font-size:16px;line-height:1.65;color:#3f403f}
    .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
    .score{border:1.5px solid var(--line);border-radius:15px;background:#fff;padding:16px}
    .score b{display:block;font-size:13px;margin-bottom:7px;color:var(--muted)}
    .score strong{font:800 34px/1 Pretendard,sans-serif}
    .score span{font-size:13px;color:var(--muted)}
    .evidence{margin:20px 0;padding:20px;border-radius:17px;background:var(--coral-soft)}
    .evidence h3{font-size:20px}
    .evidence ul{margin:0;padding-left:20px}
    .evidence li{margin:8px 0;font-size:15px;line-height:1.55}
    .handoff{margin:28px 0}
    .handoff-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
    .handoff-col{border-radius:16px;padding:18px;border:1.5px solid var(--line);background:#fff}
    .handoff-col.coral{background:var(--coral-soft);border-color:#ffc9c1}
    .handoff-col b{display:block;font-size:17px;margin-bottom:10px}
    .handoff-col p{margin:0;font-size:14px;line-height:1.62;color:#474744;white-space:pre-line}
    .arrow{display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--coral)}
    .definition{margin:30px 0;padding:24px 20px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font-size:18px;line-height:1.65}
    .all-results{display:grid;gap:11px;margin:20px 0 32px}
    .result-row{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:16px}
    .result-row-top{display:flex;align-items:flex-start;gap:10px}
    .rank{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 12px/1 Pretendard,sans-serif;flex:none}
    .result-row h3{font-size:18px;margin:1px 0 5px}
    .result-row p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
    .mini-scores{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
    .mini-scores span{border-radius:999px;background:#f0ebe5;padding:7px 9px;font:700 12px/1 Pretendard,sans-serif}
    .proof-section{margin:42px 0 0}
    .proof-intro{margin-bottom:18px}
    .review-carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:3px 3px 12px;scrollbar-width:none}
    .review-carousel::-webkit-scrollbar{display:none}
    .review{flex:0 0 88%;scroll-snap-align:center;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--soft-shadow)}
    .review-tag{color:var(--coral-dark);font-size:12px;font-weight:800;margin-bottom:10px}
    .review blockquote{margin:0;font-size:19px;line-height:1.56;letter-spacing:-.02em;font-weight:700}
    .before-after{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
    .ba{border-radius:12px;padding:12px;background:#f1ece6}
    .ba.after{background:var(--coral-soft)}
    .ba b{display:block;font-size:12px;margin-bottom:5px}
    .ba span{font-size:13px;line-height:1.5}
    .review-by{display:flex;align-items:center;gap:9px;margin-top:15px;padding-top:13px;border-top:1px dashed #d8cfc5}
    .avatar{width:35px;height:35px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
    .review-by b{display:block;font-size:13px}
    .review-by span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
    .source-link{margin-left:auto;font-size:12px;font-weight:800;color:var(--coral-dark)}
    .proof-note{margin-top:8px;font-size:12px;line-height:1.55;color:var(--muted)}
    .next-ladder{margin-top:40px}
    .ladder-step{display:grid;grid-template-columns:42px 1fr;gap:13px;padding:20px 0;border-top:1.5px solid var(--line)}
    .ladder-step:first-of-type{border-top:2px solid var(--ink)}
    .ladder-num{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 14px/1 Pretendard,sans-serif}
    .ladder-step h3{font-size:21px;margin-bottom:7px}
    .ladder-step p{margin:0 0 13px;font-size:15px;line-height:1.65;color:#484845}
    .help-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .help-card{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:16px}
    .help-card b{display:block;font-size:17px;margin-bottom:6px}
    .help-card span{display:block;color:var(--muted);font-size:13px;line-height:1.55}
    .footer{text-align:center;padding:22px 12px 0;color:var(--muted);font-size:12px;line-height:1.6}
    .footer button{border:0;background:transparent;text-decoration:underline;color:inherit;cursor:pointer;font-size:12px}

    @media(max-width:680px){
      .shell{padding:20px 11px 54px}
      .panel{padding:24px 16px;border-radius:19px}
      .future-grid{grid-template-columns:1fr}
      .future-item{min-height:auto}
      .task-grid{grid-template-columns:1fr 88px}
      .task-grid select{grid-column:1/-1}
      .handoff-grid{grid-template-columns:1fr}
      .arrow{transform:rotate(90deg);min-height:25px}
      .help-options{grid-template-columns:1fr}
      .review{flex-basis:94%}
    }
    @media(max-width:390px){
      .topbar-inner{padding-left:13px;padding-right:13px}
      h1{font-size:44px}
      h2{font-size:34px}
      .lead{font-size:17px}
      .panel{padding:22px 14px}
      .seg button{font-size:12px;padding-left:4px;padding-right:4px}
      .score strong{font-size:30px}
      .actions{flex-direction:column}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brandline">
        <span class="brandmark">차</span>
        <span class="brandname" id="brandTitle">차팀장 무료 업무 진단</span>
        <span class="version">v9.0</span>
      </div>
      <div class="progress" aria-label="진단 진행률"><i id="progressBar"></i></div>
    </div>
  </header>
  <main class="shell">
    <section class="screen" id="screen" aria-live="polite"></section>
    <footer class="footer">
      입력한 내용은 이 브라우저에만 저장되며 외부로 전송되지 않습니다.<br>
      초안과 반복 처리는 미리 맡기고, 중요한 판단과 최종 확인은 사람이 합니다.
    </footer>
  </main>

  <script>
    const STORAGE_KEY='cha-diagnosis-v9';
    const LINKS={kakao:'https://pf.kakao.com/_xgudwX'};
    const FREQS=[
      {v:1,label:'월 1~2회',mul:.4},
      {v:2,label:'주 1회',mul:1},
      {v:3,label:'주 2~4회',mul:3},
      {v:4,label:'거의 매일',mul:5}
    ];
    const REVIEWS=[
      {
        name:'김진숙 님',tag:'리샤필라테스 · 1기',avatar:'김',source:'./assets/proof/week1-kimjinsuk.png',
        quote:'수업 후에는 ‘나를 위한 비서’라는 말의 의미를 이해하게 되었고, 잘 활용할 수 있겠다는 자신감이 생겼어요.',
        before:'콘텐츠 1개에 2시간',after:'AI 5분 + 사람이 40분'
      },
      {
        name:'1기 수강생',tag:'수강 후 설문 응답',avatar:'1',source:'./assets/proof/week1-student.png',
        quote:'수업 전에는 그냥 막막했는데, 이제는 어떻게 적용해서 시간을 단축시킬지 계획이 세워지고 구조가 보여요.',
        before:'콘텐츠 1개에 2시간',after:'AI 초안 10분 · 기획 0분'
      },
      {
        name:'베이커리온',tag:'베이킹 · 1기',avatar:'베',source:'./assets/proof/week1-bakeryon.png',
        quote:'일단 시작이 반이다! 아직은 여러 번 공부해야겠지만, 조금 시스템을 이해한 느낌이에요.',
        before:'챗 기능 위주로 사용',after:'코드와 업무 구조를 이해하기 시작'
      },
      {
        name:'블리스베이킹',tag:'베이킹 · 1기',avatar:'블',source:'./assets/proof/week1-blissbaking.png',
        quote:'깨진 조각처럼 흩어져 있는 것들이 맞춰진 느낌이었어요.',
        before:'콘텐츠 1개에 2~3시간',after:'반복해서 쓸 구조를 직접 만들어봄'
      }
    ];

    const $=s=>document.querySelector(s);
    const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const uid=()=>Math.random().toString(36).slice(2,9);
    function blankTask(){return {id:uid(),name:'',minutes:'',freq:0,pattern:0,transfer:0,risk:0,data:0,criteria:0,exceptions:0,approval:0,apps:'',trigger:'',sources:'',steps:'',outcome:'',criteriaText:'',humanText:'',saveNext:''}}
    function initialState(){return {phase:'intro',business:'',scene:'',tasks:[blankTask(),blankTask(),blankTask()],selectedIds:[],selectionInitialized:false,deepIndex:0,resultSeen:false}}
    let state=initialState();
    function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&saved.phase&&Array.isArray(saved.tasks))state=saved}catch(e){}}
    function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
    function setScreen(html,pct,title='차팀장 무료 업무 진단'){
      $('#screen').innerHTML=html;
      $('#progressBar').style.width=pct+'%';
      $('#brandTitle').textContent=title;
      window.scrollTo({top:0,behavior:'instant'});
      bind();
    }
    function nav(nextLabel,nextDisabled=false,back=true){return `<div class="actions">${back?'<button class="btn soft" type="button" data-back>이전</button>':''}<button class="btn dark" type="button" data-next ${nextDisabled?'disabled':''}>${nextLabel}</button></div>`}
    function freqLabel(v){return FREQS.find(x=>x.v===Number(v))?.label||'빈도 미입력'}
    function freqMul(v){return FREQS.find(x=>x.v===Number(v))?.mul||0}
    function validTasks(){return state.tasks.filter(t=>t.name.trim()&&Number(t.minutes)>0&&Number(t.freq)>0)}
    function selectedTasks(){return state.selectedIds.map(id=>state.tasks.find(t=>t.id===id)).filter(Boolean)}
    function taskById(id){return state.tasks.find(t=>t.id===id)}
    function currentDeepTask(){return selectedTasks()[state.deepIndex]}
    function allDeepAnswered(t){return !!(t&&t.pattern&&t.transfer&&t.risk&&t.data&&t.criteria&&t.exceptions&&t.approval&&t.apps.trim())}
    function detailComplete(t){return !!(t&&t.trigger.trim()&&t.sources.trim()&&t.steps.trim()&&t.outcome.trim()&&t.criteriaText.trim()&&t.humanText.trim()&&t.saveNext.trim())}

    function renderScene(){

        <div class="section-head"><div class="eyebrow">01 · 내 일의 실제 장면</div><h2>먼저, 어떤 일을 하는 사람인지 알려주세요.</h2><p class="body">업종보다 중요한 건 실제로 반복되는 장면입니다. 완벽한 문장으로 쓰지 않아도 됩니다.</p></div>

    function renderTasks(){
      const rows=state.tasks.map((t,i)=>`<div class="task-row">

    function renderSelect(){
      const tasks=validTasks();
      if(!state.selectionInitialized){state.selectedIds=tasks.slice(0,Math.min(5,tasks.length)).map(t=>t.id);state.selectionInitialized=true}
      state.selectedIds=state.selectedIds.filter(id=>tasks.some(t=>t.id===id)).slice(0,5);
      save();
      const cards=tasks.map(t=>{const on=state.selectedIds.includes(t.id);return `<button class="candidate ${on?'on':''}" type="button" data-toggle-task="${t.id}" aria-pressed="${on}"><span class="check">${on?'✓':''}</span><span><b>${esc(t.name)}</b><small>${freqLabel(t.freq)} · 한 번에 ${esc(t.minutes)}분 · 주 ${Math.round(Number(t.minutes)*freqMul(t.freq))}분 반복</small></span></button>`}).join('');
      setScreen(`<div class="panel">
        <div class="section-head"><div class="eyebrow">03 · 비교할 업무</div><h2>근거를 확인할 일을 골라주세요.</h2><p class="body">최대 5개까지 비교합니다. 기본으로 모두 선택했어요.</p></div>
        <div class="candidate-list">${cards}</div>
        <div class="question-why" style="margin-top:18px">현재 <b>${state.selectedIds.length}개 선택</b> · 결과에는 ‘줄여야 할 필요성’과 ‘지금 맡길 준비’를 따로 보여드립니다.</div>
        ${nav('판단 근거 확인하기 →',state.selectedIds.length<1)}
      </div>`,34,'내 반복업무 찾기');
    }

    function segButtons(t,key,options){return `<div class="seg">${options.map(([label,value])=>`<button type="button" data-score-key="${key}" data-score-value="${value}" class="${Number(t[key])===value?'on':''}" aria-pressed="${Number(t[key])===value}">${label}</button>`).join('')}</div>`}
    function renderDeep(){
      const t=currentDeepTask();
      if(!t){state.phase='select';return render()}
      const total=selectedTasks().length;
      setScreen(`<div class="panel">
        <div class="section-head"><div class="eyebrow">04 · 판단 근거 ${state.deepIndex+1}/${total}</div><h2>이 일이 정말 줄여볼 영역인지 확인합니다.</h2></div>
        <div class="context"><small>${esc(state.business)} · ${freqLabel(t.freq)} · 한 번 ${esc(t.minutes)}분</small><strong>${esc(t.name)}</strong></div>

        <div class="diagnosis-group"><h3>처리 순서가 매번 얼마나 비슷한가요?</h3><p>순서와 결과 형식이 비슷할수록 미리 맡겨둘 부분을 떼어내기 쉽습니다.</p>${segButtons(t,'pattern',[['매번 많이 달라요',1],['절반쯤 비슷해요',3],['거의 같은 순서예요',5]])}</div>

        <div class="field"><label for="apps">실제로 오가는 앱·자료</label><input id="apps" value="${esc(t.apps)}" placeholder="예: 카카오채널 → 네이버 예약 → 구글 캘린더"><span class="helper">앱 이름을 몰라도 ‘문자 → 예약표 → 달력’처럼 적어도 됩니다.</span></div>
        <div class="diagnosis-group"><h3>늦거나 빠뜨리면 어떤 영향이 있나요?</h3><p>자주 하는 일보다 놓쳤을 때 고객·매출·마감에 영향이 생기는 일을 먼저 봅니다.</p>${segButtons(t,'risk',[['조금 미뤄도 괜찮아요',1],['불편하거나 지연돼요',3],['고객·매출·마감에 영향',5]])}</div>

        <div class="diagnosis-group"><h3>예외 상황은 얼마나 자주 생기나요?</h3><p>예외가 많으면 전부 맡기기보다 초안과 정리까지만 나누는 편이 안전합니다.</p>${segButtons(t,'exceptions',[['거의 매번 달라요',5],['가끔 예외가 있어요',3],['예외가 거의 없어요',1]])}</div>

      </div>`,38+Math.round((state.deepIndex+1)/Math.max(1,total)*32),'판단 근거 확인하기');

    function taskTimeScore(weekly){return weekly>=300?5:weekly>=180?4:weekly>=90?3:weekly>=30?2:1}
    function scoreTask(t){
      const weekly=Math.round(Number(t.minutes)*freqMul(t.freq));
      const time=taskTimeScore(weekly);
      const frequencyScore=({1:1,2:3,3:4,4:5})[Number(t.freq)]||0;
      const need=Math.round(((frequencyScore*.20+time*.20+Number(t.pattern)*.20+Number(t.transfer)*.15+Number(t.risk)*.25)/5)*100);
      const ready=Math.round(((Number(t.data)*.30+Number(t.criteria)*.30+(6-Number(t.exceptions))*.20+Number(t.approval)*.20)/5)*100);
      const priority=Math.round(need*.70+ready*.30);
      return {...t,weekly,need,ready,priority};
    }
    function scored(){return selectedTasks().map(scoreTask).sort((a,b)=>b.priority-a.priority)}
    function topTask(){return scored()[0]}
    function renderDetail(){
      const ranked=scored();
      if(!ranked.length){state.phase='select';return render()}
      const top=taskById(ranked[0].id);
      const fields=[
        ['trigger','시작','이 일은 언제 시작되나요?','예: 카카오채널에 신규 상담 문의가 들어오면 시작해요','시작 신호가 분명해야 어디서부터 미리 맡길지 정할 수 있어요.'],
        ['sources','자료','무엇을 보고 일하나요?','예: 고객 문의내용, 가격표, 예약 가능 시간, 기존 답변','실제 자료와 좋은 예시가 있어야 내 방식에 가까운 결과가 나옵니다.'],
        ['outcome','결과','어떤 상태가 되면 끝난 건가요?','예: 고객에게 예약 확정 안내가 나가고 예약표에 기록된 상태','끝난 상태를 정해야 결과가 들쭉날쭉해지지 않습니다.'],
        ['criteriaText','판단','무엇을 보고 결정하나요?','예: 당일 예약은 남은 시간을 확인하고, 환불은 이용일 3일 전까지만 가능해요','머릿속 기준을 꺼내야 같은 기준으로 초안을 만들 수 있어요.'],
        ['steps','순서','반복되는 처리 순서를 적어보세요.','예: 문의 확인 → 유형 나누기 → 가능 시간 확인 → 답변 초안 → 예약표 기록','완벽하지 않아도 됩니다. 실제로 손이 움직이는 순서대로 적어보세요.'],
        ['humanText','사람 확인','내가 계속 직접 판단할 부분은 무엇인가요?','예: 컴플레인 답변, 환불 결정, 가격 조정은 제가 직접 확인해요','고객의 마음·예외·최종 결정은 사람에게 남깁니다.'],
        ['saveNext','저장·다음 행동','처리 결과는 어디에 남기고 다음엔 무엇을 하나요?','예: 상담 내용을 고객관리 시트에 저장하고 하루 뒤 미응답 고객을 확인해요','기록이 남아야 다음번에 같은 설명을 반복하지 않습니다.']
      ];
      const flow=fields.map(([key,label,title,placeholder,help],i)=>`<div class="detail-step"><span class="detail-step-num">${i+1}</span><div class="detail-box"><label for="detail-${key}">${label} · ${title}</label><p>${help}</p><textarea id="detail-${key}" data-detail-key="${key}" placeholder="${placeholder}">${esc(top[key])}</textarea></div></div>`).join('');
      setScreen(`<div class="panel">
        <div class="section-head"><div class="eyebrow">05 · 1순위 업무 구조</div><h2>이제 이 일을 어디까지 맡길지 나눠봅니다.</h2><p class="body">점수만 보여주지 않고 실제 업무의 시작부터 사람 확인까지 연결합니다.</p></div>
        <div class="context"><small>현재 1순위 · ${esc(state.business)}</small><strong>${esc(top.name)}</strong></div>
        <div class="example-bar"><button class="chipbtn" type="button" data-fill-detail>상담·예약 예시로 채워보기</button></div>
        <div class="detail-flow">${flow}</div>
        ${nav('내 진단 결과 보기 →',!detailComplete(top))}
      </div>`,82,'업무 구조 잡기');

    function verdictFor(x){
      if(x.need>=70&&x.ready>=65)return {label:'이번 주에 먼저 줄여볼 일',desc:'반복을 줄일 가치가 크고, 현재 자료와 기준으로 시작할 준비도 되어 있습니다.'};
      if(x.need>=70)return {label:'자료와 기준부터 정리할 일',desc:'반복을 줄일 가치는 크지만, 먼저 자료와 판단 기준을 한곳에 모아야 합니다.'};
      if(x.ready>=65)return {label:'급하지 않지만 나중에 편해질 일',desc:'지금 맡겨보기는 어렵지 않지만, 현재 반복시간과 영향은 상대적으로 작습니다.'};
      return {label:'지금은 직접 하는 편이 나은 일',desc:'반복 필요성과 준비 상태를 함께 보면 지금 당장 줄일 우선순위는 낮습니다.'};
    }
    function evidenceFor(x){
      const reasons=[`${freqLabel(x.freq)}, 한 번에 ${x.minutes}분 — 현재 <b>주 ${x.weekly}분</b>이 이 일에 반복됩니다.`];
      reasons.push(x.pattern>=5?'처리 순서와 결과 형식이 거의 같아 반복 구간을 떼어내기 쉽습니다.':x.pattern>=3?'절반 정도 같은 순서가 있어, 공통 구간부터 나눠볼 수 있습니다.':'상황마다 순서가 많이 달라 전체보다 보조 단계만 살펴봐야 합니다.');
      reasons.push(x.transfer>=5?`${esc(x.apps)}처럼 3곳 이상에서 같은 정보를 옮기고 있습니다.`:x.transfer>=3?`${esc(x.apps)}처럼 여러 화면을 오가는 시간이 있습니다.`:'정보 이동은 많지 않아 다른 근거와 함께 판단했습니다.');
      reasons.push(x.risk>=5?'늦거나 빠뜨리면 고객·매출·마감에 영향이 생기므로 우선 확인할 가치가 큽니다.':x.risk>=3?'누락되면 불편과 지연이 생기는 일입니다.':'조금 미뤄도 영향이 작아 긴급도는 낮습니다.');
      return reasons;
    }
    function directionFor(t){
      const n=t.name.toLowerCase();
      if(/문의|상담|고객|답변|dm|댓글|리뷰/.test(n))return ['문의 내용 모으기','유형별로 나누기','기존 답변을 참고해 초안 준비','처리 내역 기록'];
      if(/예약|일정|리마인드|노쇼/.test(n))return ['예약 요청 모으기','가능 시간과 조건 확인','안내 문구 초안 준비','확인 결과 기록'];
      if(/콘텐츠|인스타|릴스|블로그|영상|자막/.test(n))return ['자료와 링크 모으기','핵심 내용과 구조 정리','내 말투로 초안 준비','수정 내용을 다음 작업에 기록'];
      if(/매출|정산|재고|발주|숫자/.test(n))return ['여러 화면의 숫자 모으기','같은 형식으로 정리','누락과 이상 표시','확인 결과 저장'];
      return ['필요한 자료 모으기','정해둔 기준으로 분류','결과 초안 준비','사람 확인 후 기록'];
    }
    function reviewCards(){return REVIEWS.map(r=>`<article class="review"><div class="review-tag">★ 1기 수강 후 실제 설문 응답</div><blockquote>“${r.quote}”</blockquote><div class="before-after"><div class="ba"><b>이전</b><span>${r.before}</span></div><div class="ba after"><b>수강 후 응답</b><span>${r.after}</span></div></div><div class="review-by"><span class="avatar">${r.avatar}</span><span><b>${r.name}</b><span>${r.tag} · 2026.08</span></span><a class="source-link" href="${r.source}" target="_blank" rel="noopener noreferrer">원문 보기</a></div></article>`).join('')}
    function renderResult(){
      const ranked=scored();
      if(!ranked.length){state.phase='select';return render()}
      const top=ranked[0],verdict=verdictFor(top),reasons=evidenceFor(top),direction=directionFor(top);
      state.resultSeen=true;save();
      const rows=ranked.map((x,i)=>{const v=verdictFor(x);return `<div class="result-row"><div class="result-row-top"><span class="rank">${i+1}</span><div><h3>${esc(x.name)}</h3><p>${v.label} · ${freqLabel(x.freq)} · 주 ${x.weekly}분 반복</p><div class="mini-scores"><span>줄일 필요 ${x.need}</span><span>맡길 준비 ${x.ready}</span></div></div></div></div>`}).join('');
      setScreen(`<div class="result-hero"><div class="eyebrow">내 답변으로 찾은 업무 반복 진단</div><h1>먼저 살펴볼 일이<br>보입니다.</h1><p>${esc(state.business)}에서 <b>${esc(top.name)}</b>을 가장 먼저 확인해볼 수 있어요.</p></div>

        <div class="decision"><span class="decision-label">진단 결론</span><h2>${verdict.label}</h2><p>${verdict.desc}</p></div>
        <div class="score-grid"><div class="score"><b>반복을 줄일 필요</b><strong>${top.need}</strong><span> / 100</span></div><div class="score"><b>지금 맡길 준비</b><strong>${top.ready}</strong><span> / 100</span></div></div>
        <p class="micro">점수는 정답이나 성과 보장이 아니라, 입력한 빈도·시간·반복 순서·정보 이동·지연 영향·준비 상태를 비교한 자가진단 기준입니다.</p>

        <div class="evidence"><h3>왜 이 일이 잡혔나요?</h3><ul>${reasons.map(r=>`<li>${r}</li>`).join('')}</ul></div>
        <div class="definition"><b>이처럼 매번 직접 하던 일 중에서</b> 같은 기준과 순서로 반복되는 부분을 떼어, 정해둔 방식대로 처리되게 만드는 것을 ‘업무 자동화’라고 합니다.</div>

        <div class="handoff"><div class="eyebrow">어디까지 미리 맡길 수 있나요?</div><div class="handoff-grid"><div class="handoff-col coral"><b>미리 맡겨둘 부분</b><p>${direction.map(x=>'· '+x).join('\n')}</p></div><div class="arrow">→</div><div class="handoff-col"><b>내가 계속 할 부분</b><p>${esc(top.humanText)}\n· 사실과 예외 최종 확인</p></div></div></div>
        <div class="evidence" style="background:#fff;border:1.5px solid var(--line)"><h3>실제로 돌아가게 만드는 7칸</h3><ul><li><b>시작:</b> ${esc(top.trigger)}</li><li><b>자료:</b> ${esc(top.sources)}</li><li><b>결과:</b> ${esc(top.outcome)}</li><li><b>판단:</b> ${esc(top.criteriaText)}</li><li><b>순서:</b> ${esc(top.steps)}</li><li><b>사람 확인:</b> ${esc(top.humanText)}</li><li><b>저장·다음:</b> ${esc(top.saveNext)}</li></ul></div>

        <div class="eyebrow" style="margin-top:38px">함께 비교한 업무</div><div class="all-results">${rows}</div>
        <div class="actions stack"><button class="btn primary" type="button" data-copy-result>진단 결과 복사해서 저장하기</button></div>

        <section class="proof-section"><div class="proof-intro"><div class="eyebrow">이 구조를 먼저 배운 1기 수강생</div><h2>“흩어진 일들이<br>맞춰지는 느낌이었어요.”</h2><p class="body">좋은 말만 만든 후기가 아니라, 2026년 8월 1주차 수업 후 실제 설문 응답에서 발췌했습니다. 개인별 시간 변화는 각 수강생의 경험이며 보장 수치가 아닙니다.</p></div><div class="review-carousel">${reviewCards()}</div><p class="proof-note">원문 보기에서 사용자가 제공한 설문 화면을 확인할 수 있습니다. 의미를 바꾸지 않는 범위에서 길이만 줄였습니다.</p></section>

        <section class="next-ladder"><div class="eyebrow">갑자기 수업 신청이 아닙니다</div><h2>결과를 봤다면,<br>쉬운 도움부터 선택하세요.</h2>
          <div class="ladder-step"><span class="ladder-num">1</span><div><h3>먼저 혼자 적용해보기</h3><p>복사한 결과의 1순위 업무에서 ‘자료 모으기’부터 해보세요. 차팀장 채널을 추가하면 업무를 줄이는 실제 예시와 팁을 계속 받아볼 수 있습니다.</p><a class="btn soft" href="${LINKS.kakao}" target="_blank" rel="noopener noreferrer">차팀장 무료 적용 팁 받아보기 →</a></div></div>
          <div class="ladder-step"><span class="ladder-num">2</span><div><h3>내 업무에 적용이 헷갈린다면</h3><p>결과 화면을 카카오채널로 보내주세요. 무엇부터 정리하면 되는지 한 가지를 무료로 짚어드립니다. 신청이나 결제를 전제로 하지 않습니다.</p><a class="btn kakao" href="${LINKS.kakao}" target="_blank" rel="noopener noreferrer">진단 결과 보내고 무료로 확인받기 →</a></div></div>
          <div class="ladder-step"><span class="ladder-num">3</span><div><h3>혼자보다 함께 완성하고 싶다면</h3><p>실제 자료로 반복해서 돌아가는 구조까지 함께 만드는 그룹과외를 운영하고 있습니다. 개별 업무를 배우는 수업도 있으며, 세부 안내는 확인 후 선택할 수 있습니다.</p><div class="help-options"><div class="help-card"><b>그룹과외</b><span>여러 업무 중 1순위를 정하고 실제로 돌아가는 구조까지 함께 완성</span></div><div class="help-card"><b>개별 업무 수업</b><span>정보를 확인한 뒤 내게 맞는지 선택 · 세부 내용은 별도 안내</span></div></div><div class="actions stack"><a class="btn dark" href="${LINKS.kakao}" target="_blank" rel="noopener noreferrer">수업이 필요한 경우에만 안내 보기 →</a></div></div></div>
        </section>
        <div class="actions"><button class="btn soft" type="button" data-restart>새로 진단하기</button></div>
      `,100,'진단 결과');
    }

    function render(){
      if(state.phase==='intro')return renderIntro();
      if(state.phase==='scene')return renderScene();
      if(state.phase==='tasks')return renderTasks();
      if(state.phase==='select')return renderSelect();
      if(state.phase==='deep')return renderDeep();
      if(state.phase==='detail')return renderDetail();
      if(state.phase==='result')return renderResult();
      state=initialState();renderIntro();
    }
    function back(){
      if(state.phase==='scene')state.phase='intro';
      else if(state.phase==='tasks')state.phase='scene';
      else if(state.phase==='select')state.phase='tasks';
      else if(state.phase==='deep'){if(state.deepIndex>0)state.deepIndex--;else state.phase='select'}
      else if(state.phase==='detail'){state.phase='deep';state.deepIndex=Math.max(0,selectedTasks().length-1)}
      else if(state.phase==='result')state.phase='detail';
      save();render();
    }
    function next(){
      if(state.phase==='scene')state.phase='tasks';
      else if(state.phase==='tasks')state.phase='select';
      else if(state.phase==='select'){state.deepIndex=0;state.phase='deep'}
      else if(state.phase==='deep'){if(state.deepIndex<selectedTasks().length-1)state.deepIndex++;else state.phase='detail'}
      else if(state.phase==='detail')state.phase='result';
      save();render();
    }
    function examplesForBusiness(){
      const b=state.business.toLowerCase();
      let rows;
      if(/베이킹|공방|클래스/.test(b))rows=[['신규 주문·수업 문의 답변',30,4],['예약 내용을 일정표에 옮기고 확정 안내',25,4],['수업 후 후기 요청과 답변 정리',20,3]];
      else if(/필라|헬스|센터|스튜디오/.test(b))rows=[['신규 회원 문의에 가격과 시간 답변',30,4],['오늘 예약 확인 후 회원에게 안내',25,4],['취소·노쇼 회원 확인 후 다시 연락',20,3]];
      else if(/콘텐츠|인스타|마케팅|크리에/.test(b))rows=[['레퍼런스 링크를 찾아 저장하고 분류',35,4],['콘텐츠 기획과 초안 작성',60,3],['댓글·DM을 확인하고 답변',25,4]];
      else if(/교육|강의|코치/.test(b))rows=[['수강생 질문을 모아 답변',35,4],['수업 일정과 링크 안내',20,3],['과제·후기를 취합해 정리',30,3]];
      else rows=[['문의·메시지를 확인하고 답변',30,4],['예약·일정을 확인해 다시 안내',25,4],['여러 화면의 자료와 숫자를 한곳에 정리',35,3]];
      state.tasks=rows.map(([name,minutes,freq])=>({...blankTask(),name,minutes,freq}));
    }
    function fillDetailExample(t){
      Object.assign(t,{
        trigger:'카카오채널에 신규 상담 문의가 들어오면 시작해요',
        sources:'고객 문의내용, 가격표, 예약 가능 시간, 이전에 보낸 좋은 답변을 참고해요',
        outcome:'고객에게 예약 가능 시간과 다음 행동이 안내되고 상담표에 기록된 상태예요',
        criteriaText:'당일 예약은 남은 시간을 확인하고, 가격 조정과 환불은 제가 직접 결정해요',
        steps:'문의 확인 → 문의 유형 나누기 → 가능 시간 확인 → 답변 초안 → 사람 확인 → 상담표 기록',
        humanText:'컴플레인 답변, 환불 결정, 가격 조정과 고객의 마음을 살피는 말은 제가 직접 확인해요',
        saveNext:'상담 내용을 고객관리 시트에 저장하고 하루 뒤 미응답 고객을 확인해요'
      });
    }
    function resultText(){
      const ranked=scored(),top=ranked[0],v=verdictFor(top),dir=directionFor(top);
      return `[차팀장 무료 업무 반복 진단]\n\n업무영역: ${state.business}\n먼저 살펴볼 일: ${top.name}\n판정: ${v.label}\n주간 반복시간: ${top.weekly}분\n줄일 필요: ${top.need}/100\n맡길 준비: ${top.ready}/100\n\n[왜 잡혔나]\n${evidenceFor(top).map(x=>'- '+x.replace(/<[^>]+>/g,'')).join('\n')}\n\n[미리 맡겨둘 부분]\n${dir.map(x=>'- '+x).join('\n')}\n\n[내가 계속 할 부분]\n- ${top.humanText}\n- 사실과 예외 최종 확인\n\n※ 점수는 입력한 답변을 비교한 자가진단 기준이며 절감시간을 보장하지 않습니다.`;
    }

    function bind(){
      const start=$('[data-start]');if(start)start.onclick=()=>{state.phase='scene';save();render()};
      const backBtn=$('[data-back]');if(backBtn)backBtn.onclick=back;
      const nextBtn=$('[data-next]');if(nextBtn)nextBtn.onclick=next;
      const business=$('#business');if(business)business.oninput=()=>{state.business=business.value;save();const b=$('[data-next]');if(b)b.disabled=!(state.business.trim()&&state.scene.trim())};
      const scene=$('#scene');if(scene)scene.oninput=()=>{state.scene=scene.value;save();const b=$('[data-next]');if(b)b.disabled=!(state.business.trim()&&state.scene.trim())};
      const sceneEx=$('[data-scene-example]');if(sceneEx)sceneEx.onclick=()=>{if(!state.business.trim())state.business='베이킹 클래스 운영';state.scene='오전마다 카카오 문의를 확인하고 예약표에 옮긴 뒤 가능한 시간을 다시 답장해요';save();render()};
      const fillTasks=$('[data-fill-tasks]');if(fillTasks)fillTasks.onclick=()=>{examplesForBusiness();save();render()};
      const addTask=$('[data-add-task]');if(addTask)addTask.onclick=()=>{state.tasks.push(blankTask());save();render()};
      document.querySelectorAll('[data-remove-task]').forEach(b=>b.onclick=()=>{state.tasks=state.tasks.filter(t=>t.id!==b.dataset.removeTask);save();render()});
      document.querySelectorAll('[data-task-name]').forEach(i=>i.oninput=()=>{taskById(i.dataset.taskName).name=i.value;save();const b=$('[data-next]');if(b)b.disabled=validTasks().length<3});
      document.querySelectorAll('[data-task-minutes]').forEach(i=>i.oninput=()=>{taskById(i.dataset.taskMinutes).minutes=Number(i.value)||'';save();const b=$('[data-next]');if(b)b.disabled=validTasks().length<3});
      document.querySelectorAll('[data-task-freq]').forEach(i=>i.onchange=()=>{taskById(i.dataset.taskFreq).freq=Number(i.value)||0;save();const b=$('[data-next]');if(b)b.disabled=validTasks().length<3});
      document.querySelectorAll('[data-toggle-task]').forEach(b=>b.onclick=()=>{const id=b.dataset.toggleTask;if(state.selectedIds.includes(id))state.selectedIds=state.selectedIds.filter(x=>x!==id);else if(state.selectedIds.length<5)state.selectedIds.push(id);save();render()});
      document.querySelectorAll('[data-score-key]').forEach(b=>b.onclick=()=>{const t=currentDeepTask();t[b.dataset.scoreKey]=Number(b.dataset.scoreValue);save();render()});
      const apps=$('#apps');if(apps)apps.oninput=()=>{const t=currentDeepTask();t.apps=apps.value;save();const b=$('[data-next]');if(b)b.disabled=!allDeepAnswered(t)};
      document.querySelectorAll('[data-detail-key]').forEach(i=>i.oninput=()=>{const t=taskById(scored()[0].id);t[i.dataset.detailKey]=i.value;save();const b=$('[data-next]');if(b)b.disabled=!detailComplete(t)});
      const fillDetail=$('[data-fill-detail]');if(fillDetail)fillDetail.onclick=()=>{fillDetailExample(taskById(scored()[0].id));save();render()};
      const copy=$('[data-copy-result]');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(resultText());copy.textContent='진단 결과가 복사됐어요 ✓'}catch(e){copy.textContent='복사할 수 없어요 · 화면을 캡처해주세요'}};
      const restart=$('[data-restart]');if(restart)restart.onclick=()=>{if(confirm('입력한 진단 내용을 지우고 새로 시작할까요?')){localStorage.removeItem(STORAGE_KEY);state=initialState();render()}};
    }

    load();
    render();
  </script>
</body>
</html>
