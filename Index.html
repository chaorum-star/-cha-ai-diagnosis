<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>차팀장 AI 직원 진단</title>
<style>

:root{
  --bg:#F6F2EC; --paper:#FFFDF9; --ink:#191816; --muted:#726E68;
  --line:#E6DED4; --orange:#F47345; --orange-soft:#FFF0E8;
  --purple:#6B55E8; --purple-soft:#F0EDFF; --green:#2B7A55;
  --shadow:0 18px 55px rgba(35,28,22,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
a{color:inherit}
.app{min-height:100vh}
.top{
  position:sticky; top:0; z-index:20; background:rgba(246,242,236,.92);
  backdrop-filter:blur(14px); border-bottom:1px solid rgba(0,0,0,.035)
}
.topin{max-width:760px;margin:auto;padding:14px 18px}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:10px;background:#191816;color:#fff;display:grid;place-items:center;font-weight:900}
.brand{font-size:14px;font-weight:900}
.progress{height:7px;background:#E6DED4;border-radius:99px;overflow:hidden;margin-top:12px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#FFAA7F);transition:.25s}
.wrap{max-width:760px;margin:auto;padding:24px 16px 56px}
.card{background:var(--paper);border:1px solid rgba(0,0,0,.045);border-radius:26px;padding:28px 22px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.04em;color:var(--orange);margin-bottom:12px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(36px,9.5vw,58px);line-height:1.06;letter-spacing:-.06em;margin-bottom:18px}
h2{font-size:clamp(29px,7.5vw,42px);line-height:1.15;letter-spacing:-.05em;margin-bottom:14px}
h3{font-size:20px;letter-spacing:-.035em}
.lead{font-size:17px;line-height:1.68;color:#4E4A45}
.sub{font-size:14px;line-height:1.6;color:var(--muted)}
.field{margin:22px 0}
.field input,.field textarea{
  width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;
  padding:17px 16px;outline:0;font-size:16px
}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(107,85,232,.09)}
.choices{display:grid;gap:11px;margin-top:20px}
.choice{
  width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--ink);
  border-radius:17px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px
}
.choice.selected{border-color:var(--purple);background:var(--purple-soft)}
.choice b{font-size:16px}
.choice small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid #CFC6BC;display:grid;place-items:center;flex:none}
.choice.selected .dot{background:var(--purple);border-color:var(--purple);color:#fff}
.actions{display:flex;gap:10px;margin-top:28px}
.btn{border:0;border-radius:14px;padding:15px 17px;font-weight:900;min-height:50px}
.btn.main{background:#191816;color:#fff;flex:1}
.btn.orange{background:var(--orange);color:#fff;flex:1}
.btn.soft{background:#EFE9E2;color:#3F3A35}
.btn:disabled{opacity:.35}
.note{background:var(--orange-soft);border-radius:16px;padding:15px 16px;font-size:13px;line-height:1.55;color:#754936;margin-top:18px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.pill{background:#F0EAE4;border-radius:99px;padding:8px 10px;font-size:12px;font-weight:800}
.resultHero{background:linear-gradient(135deg,#191816,#2C2545);color:#fff;border-radius:24px;padding:25px;margin-bottom:15px}
.resultHero .eyebrow{color:#FFB498}
.resultHero p{color:#DAD6E2;line-height:1.6;margin:0}
.score{font-size:52px;font-weight:950;letter-spacing:-.06em}
.resultCard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:12px}
.bar{height:8px;background:#EEE8E1;border-radius:99px;overflow:hidden;margin:13px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),#9D8BFF)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini{background:#F7F3EF;border-radius:14px;padding:12px}
.mini b{display:block;font-size:12px;margin-bottom:4px}
.mini span{font-size:12px;color:var(--muted)}
.cta{background:var(--purple-soft);border:1px solid #DDD5FF;border-radius:20px;padding:20px;margin-top:18px}
.cta h3{margin-bottom:8px}
.cta p{color:#5F5879;line-height:1.55;margin:0}
.rank{display:flex;gap:12px;align-items:flex-start}
.num{width:34px;height:34px;border-radius:11px;background:#191816;color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.rankmain{flex:1}
.rankmain h3{margin:0 0 5px}
.rankmain p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.copybox{white-space:pre-wrap;background:#191816;color:#F5F1EA;border-radius:17px;padding:16px;font-size:12px;line-height:1.55;max-height:260px;overflow:auto}
.footer{font-size:11px;color:#8A857F;text-align:center;line-height:1.5;padding-top:14px}
@media(max-width:520px){
  .wrap{padding-left:12px;padding-right:12px}
  .card{padding:24px 17px;border-radius:22px}
  .grid2{grid-template-columns:1fr}
}

.hero{padding:40px 4px 20px}
.modecards{display:grid;gap:14px;margin-top:24px}
.modecard{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.modecard.dark{background:linear-gradient(135deg,#191816,#2C2545);color:#fff;border:0}
.modecard .tag{display:inline-block;border-radius:99px;padding:7px 10px;background:var(--purple-soft);color:var(--purple);font-size:11px;font-weight:900;margin-bottom:12px}
.modecard.dark .tag{background:rgba(255,255,255,.12);color:#FFB498}
.modecard h2{font-size:27px;margin-bottom:10px}
.modecard p{color:var(--muted);line-height:1.55;margin:0}
.modecard.dark p{color:#D8D4E0}
.go{font-weight:900;margin-top:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="topin">
    <div class="brandrow"><span class="logo">차</span><span class="brand" id="brandTitle">차팀장랩</span></div>
    <div class="progress"><i id="bar"></i></div>
  </div>
</header>
<main class="wrap">
  <section class="card" id="screen"></section>
  <div class="footer">차팀장랩 · AI는 초안과 정리를 맡고, 중요한 판단과 최종 승인은 사람이 합니다.</div>
</main>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

let mode='home';
let freeState={step:0,job:'',task:'',freq:0,time:0,rules:0};
let classState={step:0,industry:'',team:'',customer:'',tasks:[],ti:0,qi:0};

const classQs=[
 {k:'freq',t:'이 일은 얼마나 자주 하나요?',a:[['거의 매일',5],['주 2~4회',4],['주 1회',3],['월 2~3회',2],['가끔',1]]},
 {k:'time',t:'한 번 할 때 얼마나 걸리나요?',a:[['10분 이하',1],['10~30분',2],['30~60분',3],['1~2시간',4],['2시간 이상',5]]},
 {k:'rules',t:'매번 비슷한 기준으로 처리하나요?',a:[['거의 같은 기준',5],['대체로 비슷함',4],['절반 정도 비슷함',3],['상황마다 많이 다름',2],['매번 완전히 다름',1]]},
 {k:'data',t:'필요한 자료는 얼마나 정리돼 있나요?',a:[['한곳에 잘 정리됨',5],['몇 군데로 나뉨',4],['메신저·문서 등에 흩어짐',3],['대부분 머릿속에 있음',2],['자료가 거의 없음',1]]},
 {k:'approval',t:'AI가 초안을 만들고 내가 확인하는 방식이 괜찮나요?',a:[['그 방식이면 충분함',5],['대부분 가능',4],['반반',3],['사람 판단이 훨씬 많음',2],['맡기기 어려움',1]]}
];

function roleFor(t){
  let n=t.toLowerCase();
  if(/상담|문의|고객|cs|답변/.test(n))return '고객관리 AI 직원';
  if(/콘텐츠|인스타|블로그|릴스|유튜브|게시/.test(n))return '콘텐츠 AI 직원';
  if(/예약|일정/.test(n))return '예약관리 AI 직원';
  if(/메일|이메일/.test(n))return '메일비서 AI 직원';
  if(/정산|매출|비용|결제/.test(n))return '운영정리 AI 직원';
  return '업무보조 AI 직원';
}
function flowFor(t){
  let n=t.toLowerCase();
  if(/상담|문의|고객|cs|답변/.test(n))return '원문 → 분류 → 우선순위 → 답변 초안 → 사람 확인';
  if(/콘텐츠|인스타|블로그|릴스|유튜브|게시/.test(n))return '자료 → 주제 → 기획 → 초안 → 검수';
  if(/예약|일정/.test(n))return '예약정보 → 조건 확인 → 대상 분류 → 안내 초안 → 기록';
  if(/메일|이메일/.test(n))return '메일 → 중요도 분류 → 답장 필요 판단 → 초안 → 확인';
  return '입력자료 → 기준 판단 → 결과 초안 → 사람 확인 → 저장';
}
function setScreen(html,pct=0,title='차팀장랩'){
  $('#screen').innerHTML=html;
  $('#bar').style.width=pct+'%';
  $('#brandTitle').textContent=title;
  window.scrollTo({top:0,behavior:'instant'});
}
function choiceHtml(items,key,current,scope){
  return '<div class="choices">'+items.map(x=>`<button class="choice ${String(current)==String(x[1])?'selected':''}" data-choice data-scope="${scope}" data-key="${key}" data-val="${x[1]}"><div><b>${x[0]}</b></div><span class="dot">${String(current)==String(x[1])?'✓':''}</span></button>`).join('')+'</div>';
}
function navHtml(label='다음',disabled=false){
  return `<div class="actions"><button class="btn soft" data-back>이전</button><button class="btn main" data-next ${disabled?'disabled':''}>${label}</button></div>`;
}
function bindGlobal(){
  document.querySelectorAll('[data-choice]').forEach(btn=>{
    btn.onclick=()=>{
      const scope=btn.dataset.scope, key=btn.dataset.key, raw=btn.dataset.val;
      const val=!isNaN(Number(raw)) && raw.trim()!=='' ? Number(raw) : raw;
      if(scope==='free') freeState[key]=val;
      else if(scope==='class-profile') classState[key]=raw;
      else classState.tasks[classState.ti].s[key]=val;
      render();
    }
  });
  const b=$('[data-back]'); if(b)b.onclick=goBack;
  const n=$('[data-next]'); if(n)n.onclick=goNext;
  const st=$('[data-start]'); if(st)st.onclick=()=>{ if(mode==='free') freeState.step=1; else classState.step=1; render();};
  const add=$('[data-add]'); if(add)add.onclick=addTask;
  const copy=$('[data-copy]'); if(copy)copy.onclick=copyClassSummary;
  const home=$('[data-home]'); if(home)home.onclick=()=>{location.hash='';};
}
function home(){
  setScreen(`<div class="eyebrow">AI EMPLOYEE DIAGNOSIS</div>
  <h1>AI부터 배우기 전에,<br>내가 넘길 일부터.</h1>
  <p class="lead">반복업무를 기준으로 지금 어떤 일을 AI에게 먼저 맡기면 좋은지 진단합니다.</p>
  <div class="modecards">
    <a class="modecard dark" href="#free"><span class="tag">무료 · 약 3분</span><h2>내가 먼저 뽑아야 할<br>AI 직원 찾기</h2><p>가장 많이 반복하는 업무 하나를 빠르게 진단합니다.</p><div class="go">무료 진단 시작 →</div></a>
    <a class="modecard" href="#class"><span class="tag">수강 전 · 약 5~8분</span><h2>내 업무 시스템<br>심층 진단</h2><p>반복업무 여러 개를 비교해 우선순위 TOP3와 실제 구축 순서를 정합니다.</p><div class="go">심층 진단 시작 →</div></a>
  </div>`,0,'차팀장랩');
}
function renderFree(){
  const s=freeState.step;
  const p=Math.min(100,Math.round(s/6*100));
  if(s===0) setScreen(`<div class="eyebrow">무료 · 약 3분</div><h1>내가 먼저 뽑아야 할<br>AI 직원은?</h1><p class="lead">자동화 도구보다 먼저, 지금 반복하는 일 하나가 AI에게 맡기기 좋은 일인지 확인합니다.</p><div class="note">“뭘 자동화해야 할지 모르겠어요”여도 괜찮아요. 실제로 반복하는 일부터 묻습니다.</div><div class="actions"><button class="btn orange" data-start>무료 진단 시작 →</button></div>`,2,'무료 AI 직원 진단');
  else if(s===1) setScreen(`<div class="eyebrow">1 / 5</div><h2>어떤 일을 하고 계세요?</h2><div class="field"><input id="job" value="${esc(freeState.job)}" placeholder="예: 필라테스 센터, 베이커리, 온라인 쇼핑몰"></div>${navHtml('다음',!freeState.job)}`,17,'무료 AI 직원 진단');
  else if(s===2) setScreen(`<div class="eyebrow">2 / 5</div><h2>지난 일주일에<br>가장 자주 반복한 일은?</h2><p class="sub">“고객관리”보다 “상담 후 미등록 고객 후속 연락”처럼 구체적으로 적어주세요.</p><div class="field"><input id="task" value="${esc(freeState.task)}" placeholder="예: 상담 후 미등록 고객 후속 연락"></div>${navHtml('다음',!freeState.task)}`,34,'무료 AI 직원 진단');
  else if(s===3) setScreen(`<div class="eyebrow">3 / 5</div><h2>이 일은 얼마나 자주 하나요?</h2>${choiceHtml([['거의 매일',5],['주 2~4회',4],['주 1회',3],['월 2~3회',2],['가끔',1]],'freq',freeState.freq,'free')}${navHtml('다음',!freeState.freq)}`,51,'무료 AI 직원 진단');
  else if(s===4) setScreen(`<div class="eyebrow">4 / 5</div><h2>한 번 할 때 얼마나 걸리나요?</h2>${choiceHtml([['10분 이하',1],['10~30분',2],['30~60분',3],['1~2시간',4],['2시간 이상',5]],'time',freeState.time,'free')}${navHtml('다음',!freeState.time)}`,68,'무료 AI 직원 진단');
  else if(s===5) setScreen(`<div class="eyebrow">5 / 5</div><h2>매번 비슷한 기준으로 처리하나요?</h2>${choiceHtml([['거의 같은 기준',5],['대체로 비슷함',4],['절반 정도 비슷함',3],['상황마다 많이 다름',2],['매번 완전히 다름',1]],'rules',freeState.rules,'free')}${navHtml('결과 보기',!freeState.rules)}`,85,'무료 AI 직원 진단');
  else {
    const score=Math.round((freeState.freq*30+freeState.time*25+freeState.rules*30+4*15)/5);
    const readiness=Math.round(freeState.rules/5*100);
    const potential=Math.round((freeState.freq+freeState.time)/10*100);
    setScreen(`<div class="resultHero"><div class="eyebrow">무료 진단 결과</div><h2>가장 먼저 뽑을 AI 직원</h2><div class="score">${score}점</div><p><b>${esc(freeState.task)}</b> 업무는 AI에게 ${score>=72?'먼저 맡겨볼 가치가 높은':'부분적으로 맡겨볼 수 있는'} 업무입니다.</p></div>
    <div class="resultCard"><div class="rank"><div class="num">1</div><div class="rankmain"><h3>${roleFor(freeState.task)}</h3><p>${flowFor(freeState.task)}</p></div></div><div class="bar"><i style="width:${score}%"></i></div><div class="grid2"><div class="mini"><b>AI 준비도</b><span>${readiness}%</span></div><div class="mini"><b>시간절감 잠재력</b><span>${potential}%</span></div></div></div>
    <div class="cta"><h3>업무 하나만 보면 반쪽 진단이에요.</h3><p>실제로는 고객관리·콘텐츠·예약·메일 등을 함께 비교해야 어디부터 넘길지 보입니다.</p><div class="actions"><a class="btn orange" href="#class" style="text-decoration:none;text-align:center">내 업무 TOP3 진단하기 →</a></div></div>
    <div class="actions"><button class="btn soft" data-home>처음으로</button></div>`,100,'무료 AI 직원 진단');
  }
}
function renderClass(){
  const s=classState.step;
  if(s===0) setScreen(`<div class="eyebrow">수강 전 · 약 5~8분</div><h1>내 사업에 필요한<br>AI 직원 TOP3</h1><p class="lead">반복업무 여러 개를 펼쳐 시간·반복성·판단기준·자료상태·사람검수를 기준으로 우선순위를 정합니다.</p><div class="note">결과는 “무엇을 배울지”가 아니라 <b>집중반에서 무엇을 구축할지</b> 정하는 사전자료로 씁니다.</div><div class="actions"><button class="btn orange" data-start>심층진단 시작 →</button></div>`,2,'수강 전 심층진단');
  else if(s===1) setScreen(`<div class="eyebrow">기본정보 1 / 3</div><h2>어떤 일을 하고 계세요?</h2><div class="field"><input id="industry" value="${esc(classState.industry)}" placeholder="예: 필라테스 센터, 베이커리, 온라인 쇼핑몰"></div>${navHtml('다음',!classState.industry)}`,8,'수강 전 심층진단');
  else if(s===2) setScreen(`<div class="eyebrow">기본정보 2 / 3</div><h2>몇 명이 함께 일하나요?</h2>${choiceHtml([['혼자 운영','혼자 운영'],['2~5명','2~5명'],['6명 이상','6명 이상']],'team',classState.team,'class-profile')}${navHtml('다음',!classState.team)}`,14,'수강 전 심층진단');
  else if(s===3) setScreen(`<div class="eyebrow">기본정보 3 / 3</div><h2>주로 누구를 상대하나요?</h2><div class="field"><input id="customer" value="${esc(classState.customer)}" placeholder="예: 30~50대 여성 회원"></div>${navHtml()}`,20,'수강 전 심층진단');
  else if(s===4){
    const chips=classState.tasks.map((t,i)=>`<span class="pill">${i+1}. ${esc(t.name)}</span>`).join('');
    setScreen(`<div class="eyebrow">반복업무 꺼내기</div><h2>지난 일주일에<br>2번 이상 한 일을 적어주세요.</h2><p class="sub">최소 3개, 최대 8개. 업무는 가능한 구체적으로 적어주세요.</p><div class="field"><input id="taskin" placeholder="예: 상담 후 미등록 고객 정리"></div><div class="actions"><button class="btn soft" data-add>+ 업무 추가</button></div><div class="pills">${chips}</div>${navHtml(`이 ${classState.tasks.length}개 업무 진단하기 →`,classState.tasks.length<3)}`,27,'수강 전 심층진단');
  } else if(s===5){
    const t=classState.tasks[classState.ti],q=classQs[classState.qi],done=classState.ti*5+classState.qi;
    const p=30+Math.round(done/(classState.tasks.length*5)*58);
    setScreen(`<div class="eyebrow">업무 ${classState.ti+1} / ${classState.tasks.length} · 질문 ${classState.qi+1} / 5</div><div class="pills"><span class="pill">${esc(t.name)}</span></div><h2>${q.t}</h2>${choiceHtml(q.a,q.k,t.s[q.k],'class-task')}${navHtml(classState.ti===classState.tasks.length-1&&classState.qi===4?'결과 보기':'다음',!t.s[q.k])}`,p,'수강 전 심층진단');
  } else {
    const ranked=calcClass(), top=ranked.slice(0,3);
    const cards=top.map((t,i)=>`<div class="resultCard"><div class="rank"><div class="num">${i+1}</div><div class="rankmain"><h3>${roleFor(t.name)}</h3><p><b>${esc(t.name)}</b><br>${flowFor(t.name)}</p></div><div style="font-size:25px;font-weight:950;color:var(--purple)">${t.score}</div></div><div class="bar"><i style="width:${t.score}%"></i></div><div class="grid2"><div class="mini"><b>AI 준비도</b><span>${t.ready}%</span></div><div class="mini"><b>시간절감 잠재력</b><span>${t.potential}%</span></div></div></div>`).join('');
    setScreen(`<div class="resultHero"><div class="eyebrow">AI 직원 배치안</div><h2>${esc(classState.industry)}에서<br>먼저 구축할 TOP3</h2><p>입력한 ${classState.tasks.length}개 업무를 비교했습니다.</p></div>${cards}
    <div class="cta"><h3>집중반에서는 이렇게 씁니다.</h3><p><b>1순위 실제 구축 → 재실행 → 오류 수정 → 2·3순위 업무로 확장</b>합니다.</p></div>
    <div style="margin-top:20px"><h3>차팀장에게 보내는 진단 요약</h3><div class="copybox">${esc(classSummary())}</div><div class="actions"><button class="btn orange" data-copy>진단결과 복사</button></div></div>
    <div class="actions"><button class="btn soft" data-home>처음으로</button></div>`,100,'수강 전 심층진단');
  }
}
function calcClass(){
  classState.tasks.forEach(t=>{
    const s=t.s;
    t.score=Math.round((s.freq*25+s.time*20+s.rules*25+s.data*15+s.approval*15)/5);
    t.ready=Math.round((s.rules+s.data+s.approval)/15*100);
    t.potential=Math.round((s.freq+s.time)/10*100);
  });
  return [...classState.tasks].sort((a,b)=>b.score-a.score);
}
function classSummary(){
  const r=calcClass().slice(0,3);
  return `[차팀장 AI 업무 시스템 심층진단]

업종/업무: ${classState.industry}
팀 규모: ${classState.team}
주요 고객: ${classState.customer||'-'}

AI 직원 TOP3
1. ${r[0]?.name||'-'} / ${r[0]?.score||'-'}점
2. ${r[1]?.name||'-'} / ${r[1]?.score||'-'}점
3. ${r[2]?.name||'-'} / ${r[2]?.score||'-'}점

집중반에서 우선 확인할 것
- 필요한 입력자료
- 내가 직접 판단하는 기준
- 사람이 승인할 지점
- 결과 저장 위치와 다음 행동`;
}
function goNext(){
  if(mode==='free'){
    if(freeState.step===1){const v=$('#job').value.trim();if(!v)return;freeState.job=v;}
    if(freeState.step===2){const v=$('#task').value.trim();if(!v)return;freeState.task=v;}
    freeState.step++; render(); return;
  }
  if(mode==='class'){
    if(classState.step===1){const v=$('#industry').value.trim();if(!v)return;classState.industry=v;classState.step=2;}
    else if(classState.step===2){if(!classState.team)return;classState.step=3;}
    else if(classState.step===3){classState.customer=$('#customer').value.trim();classState.step=4;}
    else if(classState.step===4){if(classState.tasks.length<3)return;classState.step=5;classState.ti=0;classState.qi=0;}
    else if(classState.step===5){
      const t=classState.tasks[classState.ti],q=classQs[classState.qi]; if(!t.s[q.k])return;
      if(classState.qi<4)classState.qi++;
      else if(classState.ti<classState.tasks.length-1){classState.ti++;classState.qi=0;}
      else classState.step=6;
    }
    render();
  }
}
function goBack(){
  if(mode==='free'){
    if(freeState.step<=0) location.hash='';
    else freeState.step--;
  } else {
    if(classState.step===1)classState.step=0;
    else if(classState.step===2)classState.step=1;
    else if(classState.step===3)classState.step=2;
    else if(classState.step===4)classState.step=3;
    else if(classState.step===5){
      if(classState.qi>0)classState.qi--;
      else if(classState.ti>0){classState.ti--;classState.qi=4;}
      else classState.step=4;
    } else if(classState.step===6){classState.step=5;classState.ti=classState.tasks.length-1;classState.qi=4;}
  }
  render();
}
function addTask(){
  const el=$('#taskin'),v=el.value.trim();
  if(!v || classState.tasks.length>=8)return;
  classState.tasks.push({name:v,s:{}});
  render();
}
async function copyClassSummary(){
  try{await navigator.clipboard.writeText(classSummary());alert('진단 결과를 복사했습니다.');}
  catch(e){alert('브라우저에서 복사가 제한됐습니다. 아래 요약을 길게 눌러 복사해주세요.');}
}
function route(){
  const h=location.hash.replace('#','');
  mode=h==='free'?'free':h==='class'?'class':'home';
  render();
}
function render(){
  if(mode==='home')home();
  else if(mode==='free')renderFree();
  else renderClass();
  bindGlobal();
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
